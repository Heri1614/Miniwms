<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MiniWMS AR · V8 Espejo Pro</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  overflow:hidden;
  background:#02040a;
  font-family:'Segoe UI',Arial,sans-serif;
  color:#e0eaff;
}
#topbar{
  position:fixed;
  top:0;left:0;right:0;
  z-index:90;
  min-height:56px;
  padding:10px 12px;
  background:linear-gradient(180deg,rgba(5,10,22,.97),rgba(5,10,22,.72));
  border-bottom:1px solid rgba(79,195,247,.30);
  backdrop-filter:blur(10px);
}
#topbar h1{
  font-size:15px;
  color:#4fc3f7;
  font-weight:800;
  letter-spacing:.4px;
  line-height:1.1;
}
#topbar p{
  margin-top:2px;
  font-size:10.5px;
  color:#7fb3e0;
}
#status{
  position:fixed;
  top:68px;
  left:50%;
  transform:translateX(-50%);
  z-index:95;
  min-width:245px;
  text-align:center;
  padding:8px 16px;
  border-radius:24px;
  background:rgba(80,15,15,.94);
  border:1px solid #e74c3c;
  color:#ffb3b3;
  font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.42);
  backdrop-filter:blur(8px);
}
#status.ok{
  background:rgba(7,88,48,.94);
  border-color:#2ecc71;
  color:#55efc4;
}
#controls{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:100;
  padding:12px;
  border-radius:18px;
  background:rgba(5,10,22,.92);
  border:1px solid #1b3660;
  box-shadow:0 14px 36px rgba(0,0,0,.50);
  backdrop-filter:blur(10px);
}
#controls.hidden{display:none}
#showControls{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:110;
  display:none;
  padding:10px 18px;
  border-radius:30px;
  border:1px solid #4fc3f7;
  background:rgba(5,10,22,.94);
  color:#4fc3f7;
  font-size:13px;
  font-weight:800;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
}
#showControls.show{display:block}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:10px;
}
.mini-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:12px 8px;
  border-radius:12px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.72);
  color:#a8d4ff;
  font-size:12.5px;
  font-weight:700;
}
button:active{transform:scale(.98)}
button.primary{border-color:#4fc3f7;color:#4fc3f7}
button.green{border-color:#2ecc71;color:#55efc4}
button.orange{border-color:#f39c12;color:#f5b041}
button.purple{border-color:#9b59b6;color:#d7b4ea}
button.red{border-color:#e74c3c;color:#ff9999}
.searchRow{
  display:flex;
  gap:8px;
  margin-top:6px;
}
input{
  flex:1;
  min-width:0;
  padding:12px 10px;
  border-radius:12px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.62);
  color:#e0eaff;
  font-size:13px;
  outline:none;
}
input:focus{border-color:#4fc3f7}
#info{
  margin-top:10px;
  padding:10px 12px;
  border-radius:14px;
  border:1px solid rgba(79,195,247,.22);
  background:rgba(12,25,55,.66);
  color:#c7dcf5;
  font-size:12.2px;
  line-height:1.55;
}
#info b{color:#4fc3f7}
#hint{
  margin-top:7px;
  color:#7fb3e0;
  font-size:10px;
  line-height:1.55;
}
@media(max-width:420px){
  .mini-grid button{padding:10px 4px;font-size:12px}
}
</style>
</head>

<body>

<div id="topbar">
  <h1>🏭 MiniWMS AR · V8 Espejo Pro</h1>
  <p>Vista AR tipo maqueta operativa · racks, zonas, locales, ruta y búsqueda</p>
</div>

<div id="status">Buscando marcador HIRO...</div>

<div id="controls">
  <div class="grid">
    <button class="primary" onclick="scaleWarehouse(1.12)">+ Acercar</button>
    <button class="primary" onclick="scaleWarehouse(0.88)">− Alejar</button>

    <button onclick="rotateWarehouse(-15)">↶ Girar</button>
    <button onclick="rotateWarehouse(15)">↷ Girar</button>

    <button class="green" onclick="toggleWarehouse()">Almacén</button>
    <button class="orange" onclick="toggleHeatmap()">Ocupación</button>

    <button class="purple" onclick="toggleRoute()">Ruta Pick</button>
    <button onclick="resetWarehouse()">Reset</button>

    <button class="primary" onclick="toggleStyleMode()">Visual</button>
    <button class="orange" onclick="toggleAnchor()">Base AR</button>

    <button class="purple" onclick="toggleDetail()">Detalle</button>
    <button class="red" onclick="clearHighlight()">Limpiar</button>
  </div>

  <div class="mini-grid">
    <button class="purple" onclick="moveWarehouse(0,-0.08)">↑</button>
    <button class="purple" onclick="moveWarehouse(-0.08,0)">←</button>
    <button class="purple" onclick="moveWarehouse(0.08,0)">→</button>
    <button class="purple" onclick="moveWarehouse(0,0.08)">↓</button>
  </div>

  <div class="searchRow">
    <input id="searchInput" placeholder="Buscar rack, local o NP. Ej: RC07, RC07-3-05, 98A1850" onkeydown="if(event.key==='Enter')searchTarget()">
    <button class="primary" onclick="searchTarget()">Buscar</button>
  </div>

  <div id="info">
    <b>Estado:</b> esperando marcador. Al detectarlo, se mostrará el layout AR tipo MiniWMS.
  </div>

  <div id="hint">
    Prueba: <b>RC07</b>, <b>RC07-3-05</b>, <b>98A1850</b>, <b>100506046</b>.  
    Si se pone lento, toca <b>Detalle</b>.
  </div>

  <div style="margin-top:10px">
    <button onclick="hideControls()">Ocultar controles</button>
  </div>
</div>

<button id="showControls" onclick="showControls()">▲ Controles</button>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; antialias:true; alpha:true;"
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; trackingMethod:best;">

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">

    <a-entity id="anchorGroup" visible="true">
      <a-box position="0 0.010 0" width="1.34" height="0.016" depth="1.34" color="#7ff3ff" opacity="0.13" transparent="true"></a-box>
      <a-ring position="0 0.026 0" rotation="-90 0 0" radius-inner="0.48" radius-outer="0.56" color="#4fc3f7" opacity="0.50" transparent="true"></a-ring>
      <a-box position="0 0.029 0" width="1.02" height="0.010" depth="0.018" color="#ffe000" opacity="0.40" transparent="true"></a-box>
      <a-box position="0 0.030 0" width="0.018" height="0.010" depth="1.02" color="#ffe000" opacity="0.40" transparent="true"></a-box>
    </a-entity>

    <a-entity id="warehouse" position="0 0.042 0" rotation="0 0 0" scale="0.060 0.060 0.060" visible="true"></a-entity>
    <a-entity id="routeGroup" position="0 0.042 0" rotation="0 0 0" scale="0.060 0.060 0.060" visible="false"></a-entity>
    <a-entity id="localHighlight" position="0 0.042 0" rotation="0 0 0" scale="0.060 0.060 0.060" visible="false"></a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const RACKS = [
  {id:'RC01', x:-8.6, z:-4.8, levels:4, bays:8, occ:22, cap:32, nps:['98A1850','100506046'], dir:'LTR'},
  {id:'RC02', x:-5.2, z:-4.8, levels:4, bays:8, occ:26, cap:32, nps:['99B5492','E7137200'], dir:'RTL'},
  {id:'RC03', x:-1.8, z:-4.8, levels:4, bays:8, occ:14, cap:32, nps:['C5520','J4500'], dir:'LTR'},
  {id:'RC04', x: 1.6, z:-4.8, levels:4, bays:8, occ:28, cap:32, nps:['100506046','K8810'], dir:'RTL'},
  {id:'RC05', x: 5.0, z:-4.8, levels:4, bays:8, occ:31, cap:32, nps:['98A1850','D3301'], dir:'LTR'},

  {id:'RC06', x:-8.6, z: 0.0, levels:5, bays:8, occ:35, cap:40, nps:['T1010','98A1850'], dir:'LTR'},
  {id:'RC07', x:-5.2, z: 0.0, levels:5, bays:8, occ:37, cap:40, nps:['100506046','98A1850'], dir:'RTL'},
  {id:'RC08', x:-1.8, z: 0.0, levels:5, bays:8, occ:16, cap:40, nps:['Q5510','N9900'], dir:'LTR'},
  {id:'RC09', x: 1.6, z: 0.0, levels:5, bays:8, occ:39, cap:40, nps:['E7137200','C5520'], dir:'RTL'},
  {id:'RC10', x: 5.0, z: 0.0, levels:5, bays:8, occ:32, cap:40, nps:['100506046','99B5492'], dir:'LTR'},

  {id:'RC11', x:-8.6, z: 4.8, levels:4, bays:8, occ:12, cap:32, nps:['P1100','U1120'], dir:'LTR'},
  {id:'RC12', x:-5.2, z: 4.8, levels:4, bays:8, occ:29, cap:32, nps:['98A1850','M3300'], dir:'RTL'},
  {id:'RC13', x:-1.8, z: 4.8, levels:4, bays:8, occ:18, cap:32, nps:['R4400','S5521'], dir:'LTR'},
  {id:'RC14', x: 1.6, z: 4.8, levels:4, bays:8, occ:30, cap:32, nps:['100506046','98A1850'], dir:'RTL'},
  {id:'RC15', x: 5.0, z: 4.8, levels:4, bays:8, occ:20, cap:32, nps:['V2001','W8871'], dir:'LTR'}
];

let rackMap = new Map();
let routeVisible = false;
let heatmap = false;
let styleMode = 'realista';
let highDetail = true;
let warehouseVisible = true;
let anchorVisible = true;
let currentScale = 0.060;
let currentRotation = 0;
let offsetX = 0;
let offsetZ = 0;

function E(tag, attrs = {}){
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}

function updateInfo(html){
  document.getElementById('info').innerHTML = html;
}

function isHolo(){
  return styleMode === 'holograma';
}

function frameColor(ratio){
  if(heatmap){
    if(ratio >= 0.90) return '#e74c3c';
    if(ratio >= 0.70) return '#f39c12';
    return '#2ecc71';
  }
  return isHolo() ? '#65d8ff' : '#6f8cad';
}

function palletColor(ratio){
  if(heatmap){
    if(ratio >= 0.90) return '#ff6b6b';
    if(ratio >= 0.70) return '#f5b041';
    return '#55efc4';
  }
  return isHolo() ? '#00d9ff' : '#55aaff';
}

function floorColor(){
  return isHolo() ? '#061c39' : '#101826';
}

function floorOpacity(){
  return isHolo() ? '0.52' : '0.96';
}

function buildWarehouse(){
  const w = document.getElementById('warehouse');
  w.innerHTML = '';
  rackMap.clear();

  buildFloor(w);
  buildGrid(w);
  buildPerimeter(w);
  buildAisles(w);
  buildZones(w);
  buildDocks(w);
  buildTrailers(w);
  buildColumns(w);
  buildSafetyItems(w);

  RACKS.forEach(r => buildRack(w, r));

  w.appendChild(E('a-text', {
    value:'MiniWMS Layout · CEVA AR',
    position:'-10.0 0.16 -6.65',
    rotation:'-90 0 0',
    color:'#4fc3f7',
    width:'5.8'
  }));

  buildRoute(routeVisible);
}

function buildFloor(parent){
  parent.appendChild(E('a-box', {
    position:'-1.8 0 0',
    width:'19.2',
    height:'0.08',
    depth:'14.2',
    color:floorColor(),
    opacity:floorOpacity(),
    transparent:isHolo() ? 'true' : 'false'
  }));

  parent.appendChild(E('a-box', {
    position:'-1.8 0.045 0',
    width:'19.35',
    height:'0.012',
    depth:'14.35',
    color:'#4fc3f7',
    opacity:isHolo() ? '0.18' : '0.07',
    transparent:'true'
  }));
}

function buildGrid(parent){
  if(!highDetail) return;

  for(let x=-11; x<=8; x+=1){
    parent.appendChild(E('a-box', {
      position:`${x} 0.046 0`,
      width:'0.012',
      height:'0.010',
      depth:'13.5',
      color:'#20486f',
      opacity:isHolo() ? '0.45' : '0.10',
      transparent:'true'
    }));
  }

  for(let z=-7; z<=7; z+=1){
    parent.appendChild(E('a-box', {
      position:`-1.8 0.047 ${z}`,
      width:'18.8',
      height:'0.010',
      depth:'0.012',
      color:'#20486f',
      opacity:isHolo() ? '0.45' : '0.10',
      transparent:'true'
    }));
  }
}

function buildPerimeter(parent){
  const color = isHolo() ? '#4fc3f7' : '#2b4366';
  const opacity = isHolo() ? '0.26' : '0.16';

  [
    {x:-1.8,z:-7.05,w:19.1,d:0.07},
    {x:-1.8,z: 7.05,w:19.1,d:0.07},
    {x:-11.35,z:0,w:0.07,d:14.1},
    {x: 7.75,z:0,w:0.07,d:14.1}
  ].forEach(b => {
    parent.appendChild(E('a-box', {
      position:`${b.x} 0.075 ${b.z}`,
      width:b.w,
      height:'0.055',
      depth:b.d,
      color,
      opacity,
      transparent:'true'
    }));
  });
}

function buildAisles(parent){
  [-2.35, 2.35].forEach(z => {
    parent.appendChild(E('a-box', {
      position:`-1.8 0.073 ${z}`,
      width:'18.5',
      height:'0.035',
      depth:'0.44',
      color:'#ffe000',
      opacity:isHolo() ? '0.32' : '0.19',
      transparent:'true'
    }));
  });

  [-10.25, 7.05].forEach(x => {
    parent.appendChild(E('a-box', {
      position:`${x} 0.074 0`,
      width:'0.36',
      height:'0.035',
      depth:'13.25',
      color:'#4fc3f7',
      opacity:isHolo() ? '0.25' : '0.13',
      transparent:'true'
    }));
  });

  // Flechas de flujo
  if(highDetail){
    [
      [-9.2,-2.35],[-6.5,-2.35],[-3.8,-2.35],[-1.1,-2.35],[1.6,-2.35],[4.3,-2.35],
      [-9.2, 2.35],[-6.5, 2.35],[-3.8, 2.35],[-1.1, 2.35],[1.6, 2.35],[4.3, 2.35]
    ].forEach(([x,z]) => addArrow(parent,x,z));
  }
}

function addArrow(parent,x,z){
  parent.appendChild(E('a-box', {
    position:`${x} 0.11 ${z}`,
    width:'0.34',
    height:'0.035',
    depth:'0.07',
    color:'#f5b041',
    opacity:'0.42',
    transparent:'true'
  }));
  parent.appendChild(E('a-cone', {
    position:`${x+0.24} 0.11 ${z}`,
    radiusBottom:'0.08',
    radiusTop:'0',
    height:'0.16',
    rotation:'0 0 -90',
    color:'#f5b041',
    opacity:'0.42',
    transparent:'true'
  }));
}

function addZone(parent,label,x,z,w,d,color){
  parent.appendChild(E('a-box', {
    position:`${x} 0.082 ${z}`,
    width:w,
    height:'0.06',
    depth:d,
    color,
    opacity:isHolo() ? '0.28' : '0.60',
    transparent:'true'
  }));

  parent.appendChild(E('a-text', {
    value:label,
    position:`${x - w/2 + 0.16} 0.17 ${z}`,
    rotation:'-90 0 0',
    color:'#ffffff',
    width:'3.6'
  }));
}

function buildZones(parent){
  addZone(parent,'RECIBO',-8.8,-6.32,3.2,0.9,'#16a085');
  addZone(parent,'SURTIDO', 4.6,-6.32,4.3,0.9,'#e67e22');
  addZone(parent,'AUDITORIA',-8.8,6.32,3.7,0.9,'#9b59b6');
  addZone(parent,'EMBARQUE',4.6,6.32,4.3,0.9,'#3498db');

  if(highDetail){
    addZone(parent,'QA HOLD',-1.8,6.32,2.5,0.72,'#e74c3c');
    addZone(parent,'STAGING',-1.8,-6.32,2.5,0.72,'#f39c12');
  }
}

function buildDocks(parent){
  for(let i=0;i<4;i++){
    const x = 2.6 + i*1.05;

    parent.appendChild(E('a-box', {
      position:`${x} 0.18 -6.88`,
      width:'0.78',
      height:'0.28',
      depth:'0.24',
      color:'#596b80'
    }));

    parent.appendChild(E('a-box', {
      position:`${x} 0.42 -7.02`,
      width:'0.72',
      height:'0.34',
      depth:'0.12',
      color:'#7fe8ff',
      opacity:'0.50',
      transparent:'true'
    }));

    parent.appendChild(E('a-box', {
      position:`${x} 0.072 -6.58`,
      width:'0.82',
      height:'0.05',
      depth:'0.12',
      color:'#c98d35'
    }));
  }
}

function buildTrailers(parent){
  if(!highDetail) return;

  for(let i=0;i<2;i++){
    const x = 3.15 + i*2.15;

    parent.appendChild(E('a-box', {
      position:`${x} 0.24 -7.65`,
      width:'1.55',
      height:'0.38',
      depth:'0.62',
      color:'#d7dde6',
      opacity:'0.90',
      transparent:'true'
    }));

    parent.appendChild(E('a-box', {
      position:`${x-0.63} 0.47 -7.98`,
      width:'0.25',
      height:'0.16',
      depth:'0.08',
      color:'#2c3e50'
    }));
  }
}

function buildColumns(parent){
  const cols = [
    [-9.4,-5.05],[-5.9,-5.05],[-2.4,-5.05],[1.1,-5.05],[4.6,-5.05],
    [-9.4, 0.00],[-5.9, 0.00],[-2.4, 0.00],[1.1, 0.00],[4.6, 0.00],
    [-9.4, 5.05],[-5.9, 5.05],[-2.4, 5.05],[1.1, 5.05],[4.6, 5.05]
  ];

  cols.forEach(([x,z]) => {
    parent.appendChild(E('a-cylinder', {
      position:`${x} 0.55 ${z}`,
      radius:'0.08',
      height:'1.08',
      color:'#647180',
      opacity:isHolo() ? '0.70' : '0.96',
      transparent:isHolo() ? 'true' : 'false'
    }));
  });
}

function buildSafetyItems(parent){
  if(!highDetail) return;

  parent.appendChild(E('a-box', {
    position:'-10.75 0.20 5.8',
    width:'0.28',
    height:'0.40',
    depth:'0.15',
    color:'#e74c3c'
  }));
  parent.appendChild(E('a-text', {
    value:'EXIT',
    position:'-10.92 0.47 5.92',
    rotation:'-90 0 90',
    color:'#ffffff',
    width:'1.0'
  }));

  parent.appendChild(E('a-box', {
    position:'6.95 0.20 -5.9',
    width:'0.30',
    height:'0.40',
    depth:'0.15',
    color:'#2ecc71'
  }));
  parent.appendChild(E('a-text', {
    value:'+',
    position:'6.89 0.47 -5.80',
    rotation:'-90 0 90',
    color:'#ffffff',
    width:'1.2'
  }));

  // Montacargas pequeño
  parent.appendChild(E('a-box', {
    position:'-9.8 0.18 -6.05',
    width:'0.45',
    height:'0.25',
    depth:'0.28',
    color:'#f39c12'
  }));
  parent.appendChild(E('a-box', {
    position:'-9.45 0.30 -6.05',
    width:'0.06',
    height:'0.55',
    depth:'0.04',
    color:'#2c3e50'
  }));
}

function buildRack(parent,rack){
  const group = E('a-entity', { id:rack.id, position:`${rack.x} 0 ${rack.z}` });

  const ratio = rack.occ / rack.cap;
  const width = rack.bays * 0.265;
  const depth = 0.82;
  const levelGap = 0.285;
  const height = rack.levels * levelGap + 0.08;
  const fColor = frameColor(ratio);
  const pColor = palletColor(ratio);

  // Huella/sombra
  group.appendChild(E('a-box', {
    position:'0 0.03 0',
    width:String(width + 0.16),
    height:'0.02',
    depth:String(depth + 0.12),
    color:'#000000',
    opacity:isHolo() ? '0.16' : '0.28',
    transparent:'true'
  }));

  // Postes
  for(let i=0;i<=rack.bays;i++){
    const x = -width/2 + i*(width/rack.bays);
    [-depth/2, depth/2].forEach(z => {
      group.appendChild(E('a-box', {
        position:`${x} ${height/2} ${z}`,
        width:'0.035',
        height:String(height),
        depth:'0.035',
        color:fColor,
        opacity:isHolo() ? '0.76' : '1',
        transparent:isHolo() ? 'true' : 'false'
      }));
    });
  }

  // Largueros
  for(let lv=0;lv<=rack.levels;lv++){
    const y = lv*levelGap + 0.04;
    [-depth/2, depth/2].forEach(z => {
      group.appendChild(E('a-box', {
        position:`0 ${y} ${z}`,
        width:String(width + 0.08),
        height:'0.030',
        depth:'0.045',
        color:isHolo() ? '#8fdcff' : '#6e86a8',
        opacity:isHolo() ? '0.70' : '1',
        transparent:isHolo() ? 'true' : 'false'
      }));
    });
  }

  // Profundidad / cruceta central
  if(highDetail){
    group.appendChild(E('a-box', {
      position:`0 ${height/2} 0`,
      width:String(width + 0.04),
      height:String(height - 0.02),
      depth:'0.018',
      color:isHolo() ? '#66c8ff' : '#566b86',
      opacity:isHolo() ? '0.50' : '0.55',
      transparent:'true'
    }));
  }

  let occupiedLeft = rack.occ;
  const cells = [];

  for(let lv=1; lv<=rack.levels; lv++){
    for(let bay=1; bay<=rack.bays; bay++){
      const localX = -width/2 + (bay - 0.5)*(width/rack.bays);
      const cellY = (lv - 0.5)*levelGap + 0.06;
      const frontZ = -depth/2 - 0.02;

      // Cara del local
      if(highDetail){
        group.appendChild(E('a-box', {
          position:`${localX} ${cellY} ${frontZ}`,
          width:String((width/rack.bays)-0.035),
          height:'0.17',
          depth:'0.018',
          color:isHolo() ? '#6dd9ff' : '#2c3f59',
          opacity:isHolo() ? '0.30' : '0.78',
          transparent:'true'
        }));
      }

      const occ = occupiedLeft > 0;
      if(occ) occupiedLeft--;

      if(occ){
        group.appendChild(E('a-box', {
          class:'pallet',
          position:`${localX} ${cellY - 0.012} ${-0.20}`,
          width:String((width/rack.bays)-0.06),
          height:'0.11',
          depth:'0.20',
          color:pColor,
          opacity:isHolo() ? '0.54' : '0.95',
          transparent:isHolo() ? 'true' : 'false'
        }));

        if(highDetail){
          group.appendChild(E('a-box', {
            position:`${localX} ${cellY - 0.084} ${-0.20}`,
            width:String((width/rack.bays)-0.04),
            height:'0.018',
            depth:'0.21',
            color:'#b88436'
          }));
        }
      }

      cells.push({level:lv,bay:bay,x:localX,y:cellY,z:-0.20});
    }
  }

  group.appendChild(E('a-text', {
    value:rack.id,
    position:`${-width/2} ${height+0.12} ${-depth/2-0.18}`,
    rotation:'-70 0 0',
    color:'#ffffff',
    width:'2.0'
  }));

  if(highDetail){
    group.appendChild(E('a-text', {
      value:rack.dir,
      position:`${width/2-0.42} ${height+0.12} ${-depth/2-0.18}`,
      rotation:'-70 0 0',
      color:'#7fb3e0',
      width:'1.25'
    }));
  }

  group.addEventListener('click', () => highlightRack(rack.id));
  parent.appendChild(group);
  rackMap.set(rack.id,{meta:rack,group,cells});
}

function buildRoute(show){
  const g = document.getElementById('routeGroup');
  g.innerHTML = '';
  routeVisible = show;
  g.setAttribute('visible', show ? 'true' : 'false');

  if(!show) return;

  const points = [
    {x:-8.8,z:-6.2},
    {x:-8.8,z:-2.35},
    {x:-5.2,z:-2.35},
    {x:-5.2,z:0},
    {x:-5.2,z:4.8},
    {x:1.6,z:4.8},
    {x:1.6,z:2.35},
    {x:5.0,z:2.35},
    {x:5.0,z:-6.2}
  ];

  for(let i=0;i<points.length-1;i++){
    const a = points[i];
    const b = points[i+1];
    const midX = (a.x+b.x)/2;
    const midZ = (a.z+b.z)/2;
    const dx = b.x-a.x;
    const dz = b.z-a.z;
    const len = Math.sqrt(dx*dx + dz*dz);
    const rotY = Math.atan2(dx,dz)*180/Math.PI;

    g.appendChild(E('a-box', {
      position:`${midX} 0.13 ${midZ}`,
      width:'0.18',
      height:'0.05',
      depth:String(len),
      rotation:`0 ${rotY} 0`,
      color:'#ffe000',
      opacity:'0.72',
      transparent:'true'
    }));
  }

  points.forEach((p,i) => {
    g.appendChild(E('a-cylinder', {
      position:`${p.x} 0.15 ${p.z}`,
      radius:'0.11',
      height:'0.045',
      color:i===0 ? '#2ecc71' : (i===points.length-1 ? '#e74c3c' : '#ff8c00'),
      opacity:'0.88',
      transparent:'true'
    }));
  });
}

function applyTransforms(){
  ['warehouse','routeGroup','localHighlight'].forEach(id => {
    const el = document.getElementById(id);
    el.setAttribute('position',`${offsetX} 0.042 ${offsetZ}`);
    el.setAttribute('rotation',`0 ${currentRotation} 0`);
    el.setAttribute('scale',`${currentScale} ${currentScale} ${currentScale}`);
  });
}

function clearHighlight(showMsg=true){
  const lh = document.getElementById('localHighlight');
  lh.innerHTML = '';
  lh.setAttribute('visible','false');

  rackMap.forEach(entry => {
    entry.group.querySelectorAll('a-box').forEach(box => {
      box.removeAttribute('emissive');
      box.removeAttribute('emissiveIntensity');
    });
  });

  if(showMsg) updateInfo('<b>Resaltado limpio.</b><br>Busca rack, local o NP demo.');
}

function highlightRack(id){
  clearHighlight(false);
  const entry = rackMap.get(id);
  if(!entry) return;

  entry.group.querySelectorAll('a-box').forEach(box => {
    box.setAttribute('emissive','#ffe000');
    box.setAttribute('emissiveIntensity','0.40');
  });

  const r = entry.meta;
  updateInfo(
    `<b>${r.id}</b><br>` +
    `Ocupación: <b>${r.occ}/${r.cap}</b> (${Math.round(r.occ/r.cap*100)}%)<br>` +
    `Niveles: <b>${r.levels}</b> · Locales/nivel: <b>${r.bays}</b><br>` +
    `NP demo: ${r.nps.join(', ')}`
  );
}

function highlightLocal(rackId,level,bay){
  clearHighlight(false);

  const entry = rackMap.get(rackId);
  if(!entry){
    updateInfo(`No encontré rack: <b>${rackId}</b>`);
    return;
  }

  const cell = entry.cells.find(c => c.level===level && c.bay===bay);
  if(!cell){
    updateInfo(`No encontré local: <b>${rackId}-${level}-${String(bay).padStart(2,'0')}</b>`);
    return;
  }

  entry.group.querySelectorAll('a-box').forEach(box => {
    box.setAttribute('emissive','#4fc3f7');
    box.setAttribute('emissiveIntensity','0.16');
  });

  const lh = document.getElementById('localHighlight');
  lh.innerHTML = '';
  lh.setAttribute('visible','true');

  const worldX = entry.meta.x + cell.x;
  const worldY = cell.y;
  const worldZ = entry.meta.z + cell.z;

  lh.appendChild(E('a-box', {
    position:`${worldX} ${worldY} ${worldZ}`,
    width:'0.26',
    height:'0.20',
    depth:'0.24',
    color:'#ffe000',
    opacity:'0.34',
    transparent:'true'
  }));

  lh.appendChild(E('a-cylinder', {
    position:`${worldX} ${worldY+0.28} ${worldZ}`,
    radius:'0.08',
    height:'0.28',
    color:'#ffe000',
    opacity:'0.82',
    transparent:'true'
  }));

  lh.appendChild(E('a-sphere', {
    position:`${worldX} ${worldY+0.46} ${worldZ}`,
    radius:'0.10',
    color:'#4fc3f7',
    opacity:'0.95',
    transparent:'true'
  }));

  lh.appendChild(E('a-text', {
    value:`${rackId}-${level}-${String(bay).padStart(2,'0')}`,
    position:`${worldX-0.45} ${worldY+0.62} ${worldZ}`,
    rotation:'-70 0 0',
    color:'#ffffff',
    width:'2.2'
  }));

  updateInfo(
    `<b>Local encontrado</b><br>` +
    `Ubicación: <b>${rackId}-${level}-${String(bay).padStart(2,'0')}</b><br>` +
    `Rack: <b>${rackId}</b> · Nivel: <b>${level}</b> · Local: <b>${String(bay).padStart(2,'0')}</b>`
  );
}

function searchTarget(){
  const q = document.getElementById('searchInput').value.trim().toUpperCase();

  if(!q){
    updateInfo('Escribe un rack, local o NP demo.');
    return;
  }

  const local = q.match(/^(RC\d{2})-(\d{1,2})-(\d{1,2})$/);
  if(local){
    highlightLocal(local[1],parseInt(local[2],10),parseInt(local[3],10));
    return;
  }

  if(rackMap.has(q)){
    highlightRack(q);
    return;
  }

  const hits = RACKS.filter(r => r.nps.some(np => np.includes(q)));
  if(hits.length){
    clearHighlight(false);

    hits.forEach(r => {
      const entry = rackMap.get(r.id);
      entry.group.querySelectorAll('a-box').forEach(box => {
        box.setAttribute('emissive','#2ecc71');
        box.setAttribute('emissiveIntensity','0.40');
      });
    });

    updateInfo(`<b>NP demo encontrado:</b> ${q}<br>Ubicaciones: <b>${hits.map(h=>h.id).join(', ')}</b>`);
    return;
  }

  updateInfo(`No encontré: <b>${q}</b>`);
}

function toggleRoute(){
  routeVisible = !routeVisible;
  buildRoute(routeVisible);
  applyTransforms();

  updateInfo(routeVisible ? '<b>Ruta pick activa.</b><br>Recorrido ilustrativo sobre el layout.' : '<b>Ruta pick oculta.</b>');
}

function toggleHeatmap(){
  heatmap = !heatmap;
  buildWarehouse();
  applyTransforms();

  updateInfo(heatmap ? '<b>Ocupación activa.</b><br>Verde bajo, naranja medio, rojo crítico.' : '<b>Ocupación desactivada.</b>');
}

function toggleStyleMode(){
  styleMode = isHolo() ? 'realista' : 'holograma';
  buildWarehouse();
  applyTransforms();

  updateInfo(isHolo() ? '<b>Modo holograma activo.</b><br>Más brillo, transparencia y estilo AR.' : '<b>Modo realista activo.</b><br>Más sólido y operativo.');
}

function toggleDetail(){
  highDetail = !highDetail;
  buildWarehouse();
  applyTransforms();

  updateInfo(highDetail ? '<b>Detalle alto activo.</b><br>Más elementos visuales.' : '<b>Detalle bajo activo.</b><br>Mejor rendimiento en celular.');
}

function toggleWarehouse(){
  warehouseVisible = !warehouseVisible;
  document.getElementById('warehouse').setAttribute('visible',warehouseVisible ? 'true' : 'false');
  updateInfo(warehouseVisible ? '<b>Almacén visible.</b>' : '<b>Almacén oculto.</b>');
}

function toggleAnchor(){
  anchorVisible = !anchorVisible;
  document.getElementById('anchorGroup').setAttribute('visible',anchorVisible ? 'true' : 'false');
  updateInfo(anchorVisible ? '<b>Base AR visible.</b>' : '<b>Base AR oculta.</b>');
}

function scaleWarehouse(mult){
  currentScale = Math.max(0.024,Math.min(0.16,currentScale*mult));
  applyTransforms();
  updateInfo(`<b>Escala:</b> ${currentScale.toFixed(3)}`);
}

function rotateWarehouse(deg){
  currentRotation += deg;
  applyTransforms();
}

function moveWarehouse(dx,dz){
  offsetX += dx;
  offsetZ += dz;
  applyTransforms();
  updateInfo(`<b>Offset:</b> X ${offsetX.toFixed(2)} · Z ${offsetZ.toFixed(2)}`);
}

function resetWarehouse(){
  currentScale = 0.060;
  currentRotation = 0;
  offsetX = 0;
  offsetZ = 0;
  routeVisible = false;
  warehouseVisible = true;

  document.getElementById('warehouse').setAttribute('visible','true');
  document.getElementById('routeGroup').setAttribute('visible','false');

  buildWarehouse();
  applyTransforms();
  clearHighlight(false);

  updateInfo('<b>Vista reiniciada.</b><br>Layout centrado sobre el marcador.');
}

function hideControls(){
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('showControls').classList.add('show');
}

function showControls(){
  document.getElementById('controls').classList.remove('hidden');
  document.getElementById('showControls').classList.remove('show');
}

window.addEventListener('load', () => {
  buildWarehouse();
  applyTransforms();

  const marker = document.getElementById('hiroMarker');
  const status = document.getElementById('status');

  marker.addEventListener('markerFound', () => {
    status.textContent = 'Marcador detectado · MiniWMS AR activo';
    status.classList.add('ok');
    updateInfo('<b>Marcador detectado.</b><br>V8 activa: layout más cercano al MiniWMS original.');
  });

  marker.addEventListener('markerLost', () => {
    status.textContent = 'Buscando marcador HIRO...';
    status.classList.remove('ok');
  });
});
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MiniWMS AR · V8.2 Paleta MiniWMS</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  background:#02040a;
  font-family:'Segoe UI',Arial,sans-serif;
  color:#e0eaff;
}

#topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:90;
  min-height:38px;
  padding:6px 10px;
  background:linear-gradient(180deg,rgba(5,10,22,.90),rgba(5,10,22,.50));
  border-bottom:1px solid rgba(79,195,247,.22);
  backdrop-filter:blur(8px);
}

#topbar h1{
  font-size:13px;
  color:#4fc3f7;
  font-weight:800;
  letter-spacing:.3px;
  line-height:1.1;
}

#topbar p{
  display:none;
}

#status{
  position:fixed;
  top:46px;
  left:50%;
  transform:translateX(-50%);
  z-index:95;
  min-width:170px;
  text-align:center;
  padding:5px 12px;
  border-radius:18px;
  background:rgba(80,15,15,.82);
  border:1px solid #e74c3c;
  color:#ffb3b3;
  font-size:11px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
}

#status.ok{
  background:rgba(7,88,48,.84);
  border-color:#27ae60;
  color:#55efc4;
}

#controls{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  z-index:100;
  padding:10px;
  border-radius:16px;
  background:rgba(5,10,22,.90);
  border:1px solid #1b3660;
  box-shadow:0 12px 30px rgba(0,0,0,.48);
  backdrop-filter:blur(10px);
  max-height:64vh;
  overflow-y:auto;
}

#controls.hidden{
  display:none;
}

#showControls{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:110;
  display:none;
  padding:9px 18px;
  border-radius:30px;
  border:1px solid #4fc3f7;
  background:rgba(5,10,22,.88);
  color:#4fc3f7;
  font-size:13px;
  font-weight:800;
  box-shadow:0 8px 22px rgba(0,0,0,.42);
}

#showControls.show{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:8px;
}

.mini-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:8px;
}

button{
  width:100%;
  padding:10px 7px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.68);
  color:#a8d4ff;
  font-size:12px;
  font-weight:700;
}

button:active{
  transform:scale(.98);
}

button.primary{
  border-color:#4fc3f7;
  color:#4fc3f7;
}

button.green{
  border-color:#27ae60;
  color:#55efc4;
}

button.orange{
  border-color:#e67e22;
  color:#f39c12;
}

button.purple{
  border-color:#9b59b6;
  color:#d7b4ea;
}

button.red{
  border-color:#e74c3c;
  color:#ff9999;
}

.searchRow{
  display:flex;
  gap:8px;
  margin-top:6px;
  align-items:center;
}

.searchRow input{
  flex:1 1 auto;
  width:100%;
  min-width:0;
  padding:10px 9px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.58);
  color:#e0eaff;
  font-size:12px;
  outline:none;
  direction:ltr;
  unicode-bidi:plaintext;
  text-align:left;
  text-transform:uppercase;
}

.searchRow input:focus{
  border-color:#4fc3f7;
}

.searchRow button{
  flex:0 0 88px;
  width:88px;
  min-width:88px;
}

#info{
  margin-top:8px;
  padding:8px 10px;
  border-radius:12px;
  border:1px solid rgba(79,195,247,.20);
  background:rgba(12,25,55,.58);
  color:#c7dcf5;
  font-size:11.5px;
  line-height:1.45;
}

#info b{
  color:#4fc3f7;
}

#hint{
  margin-top:6px;
  color:#7fb3e0;
  font-size:9.5px;
  line-height:1.4;
}

@media(max-width:420px){
  .mini-grid button{
    padding:9px 4px;
    font-size:11.5px;
  }
}
</style>
</head>

<body>

<div id="topbar">
  <h1>🏭 MiniWMS AR · V8.2</h1>
  <p>Vista AR tipo maqueta operativa · racks, zonas, locales, ruta y búsqueda</p>
</div>

<div id="status">Buscando HIRO...</div>

<div id="controls">
  <div class="grid">
    <button class="primary" onclick="scaleWarehouse(1.12)">+ Acercar</button>
    <button class="primary" onclick="scaleWarehouse(0.88)">− Alejar</button>

    <button onclick="rotateWarehouse(-15)">↶ Girar</button>
    <button onclick="rotateWarehouse(15)">↷ Girar</button>

    <button class="green" onclick="toggleWarehouse()">Almacén</button>
    <button class="orange" onclick="toggleHeatmap()">Ocupación</button>

    <button class="purple" onclick="toggleRoute()">Ruta Pick</button>
    <button onclick="resetWarehouse()">Reset</button>

    <button class="primary" onclick="toggleStyleMode()">Visual</button>
    <button class="orange" onclick="toggleAnchor()">Base AR</button>

    <button class="purple" onclick="toggleDetail()">Detalle</button>
    <button class="red" onclick="clearHighlight()">Limpiar</button>
  </div>

  <div class="mini-grid">
    <button class="purple" onclick="moveWarehouse(0,-0.08)">↑</button>
    <button class="purple" onclick="moveWarehouse(-0.08,0)">←</button>
    <button class="purple" onclick="moveWarehouse(0.08,0)">→</button>
    <button class="purple" onclick="moveWarehouse(0,0.08)">↓</button>
  </div>

  <div class="searchRow">
    <input id="searchInput" placeholder="Buscar: RC07, RC07-3-05, 98A1850" onkeydown="if(event.key==='Enter')searchTarget()">
    <button class="primary" onclick="searchTarget()">Buscar</button>
  </div>

  <div id="info">
    <b>Estado:</b> esperando marcador. Al detectarlo, se mostrará el layout AR tipo MiniWMS.
  </div>

  <div id="hint">
    Prueba: <b>RC07</b>, <b>RC07-3-05</b>, <b>98A1850</b>, <b>100506046</b>.
  </div>

  <div style="margin-top:8px">
    <button onclick="hideControls()">Ocultar controles</button>
  </div>
</div>

<button id="showControls" onclick="showControls()">▲ Controles</button>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; antialias:true; alpha:true;"
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; trackingMethod:best;">

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">

    <a-entity id="anchorGroup" visible="true">
      <a-box position="0 0.010 0" width="1.34" height="0.016" depth="1.34" color="#050a16" opacity="0.12" transparent="true"></a-box>
      <a-ring position="0 0.026 0" rotation="-90 0 0" radius-inner="0.48" radius-outer="0.56" color="#4fc3f7" opacity="0.48" transparent="true"></a-ring>
      <a-box position="0 0.029 0" width="1.02" height="0.010" depth="0.018" color="#f39c12" opacity="0.38" transparent="true"></a-box>
      <a-box position="0 0.030 0" width="0.018" height="0.010" depth="1.02" color="#f39c12" opacity="0.38" transparent="true"></a-box>
    </a-entity>

    <a-entity id="warehouse" position="0 0.042 0" rotation="0 0 0" scale="0.060 0.060 0.060" visible="true"></a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const RACKS = [
  {id:'RC01', x:-8.6, z:-4.8, levels:4, bays:8, occ:22, cap:32, nps:['98A1850','100506046'], dir:'LTR'},
  {id:'RC02', x:-5.2, z:-4.8, levels:4, bays:8, occ:26, cap:32, nps:['99B5492','E7137200'], dir:'RTL'},
  {id:'RC03', x:-1.8, z:-4.8, levels:4, bays:8, occ:14, cap:32, nps:['C5520','J4500'], dir:'LTR'},
  {id:'RC04', x: 1.6, z:-4.8, levels:4, bays:8, occ:28, cap:32, nps:['100506046','K8810'], dir:'RTL'},
  {id:'RC05', x: 5.0, z:-4.8, levels:4, bays:8, occ:31, cap:32, nps:['98A1850','D3301'], dir:'LTR'},

  {id:'RC06', x:-8.6, z: 0.0, levels:5, bays:8, occ:35, cap:40, nps:['T1010','98A1850'], dir:'LTR'},
  {id:'RC07', x:-5.2, z: 0.0, levels:5, bays:8, occ:37, cap:40, nps:['100506046','98A1850'], dir:'RTL'},
  {id:'RC08', x:-1.8, z: 0.0, levels:5, bays:8, occ:16, cap:40, nps:['Q5510','N9900'], dir:'LTR'},
  {id:'RC09', x: 1.6, z: 0.0, levels:5, bays:8, occ:39, cap:40, nps:['E7137200','C5520'], dir:'RTL'},
  {id:'RC10', x: 5.0, z: 0.0, levels:5, bays:8, occ:32, cap:40, nps:['100506046','99B5492'], dir:'LTR'},

  {id:'RC11', x:-8.6, z: 4.8, levels:4, bays:8, occ:12, cap:32, nps:['P1100','U1120'], dir:'LTR'},
  {id:'RC12', x:-5.2, z: 4.8, levels:4, bays:8, occ:29, cap:32, nps:['98A1850','M3300'], dir:'RTL'},
  {id:'RC13', x:-1.8, z: 4.8, levels:4, bays:8, occ:18, cap:32, nps:['R4400','S5521'], dir:'LTR'},
  {id:'RC14', x: 1.6, z: 4.8, levels:4, bays:8, occ:30, cap:32, nps:['100506046','98A1850'], dir:'RTL'},
  {id:'RC15', x: 5.0, z: 4.8, levels:4, bays:8, occ:20, cap:32, nps:['V2001','W8871'], dir:'LTR'}
];

let rackMap = new Map();
let localMap = new Map();

let routeVisible = false;
let heatmap = false;
let styleMode = 'realista';
let highDetail = true;
let warehouseVisible = true;
let anchorVisible = true;
let currentScale = 0.060;
let currentRotation = 0;
let offsetX = 0;
let offsetZ = 0;

function E(tag, attrs = {}){
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}

function updateInfo(html){
  document.getElementById('info').innerHTML = html;
}

function isHolo(){
  return styleMode === 'holograma';
}

function frameColor(ratio){
  if(heatmap){
    if(ratio >= 0.90) return '#e74c3c';
    if(ratio >= 0.70) return '#f39c12';
    return '#55efc4';
  }
  return isHolo() ? '#4fc3f7' : '#5f7284';
}

function palletColor(ratio){
  if(heatmap){
    if(ratio >= 0.90) return '#e74c3c';
    if(ratio >= 0.70) return '#f39c12';
    return '#55efc4';
  }
  return isHolo() ? '#4fc3f7' : '#1e3c6e';
}

function localPanelColor(){
  return isHolo() ? '#4fc3f7' : '#0e1e38';
}

function buildWarehouse(){
  const w = document.getElementById('warehouse');
  w.innerHTML = '';
  rackMap.clear();
  localMap.clear();

  buildFloor(w);
  buildGrid(w);
  buildPerimeter(w);
  buildAisles(w);
  buildZones(w);
  buildDocks(w);
  buildColumns(w);

  RACKS.forEach(r => buildRack(w, r));

  buildRoute(w);

  w.appendChild(E('a-text', {
    value:'MiniWMS Layout · CEVA AR',
    position:'-10.0 0.16 -6.65',
    rotation:'-90 0 0',
    color:'#4fc3f7',
    width:'5.8'
  }));
}

function buildFloor(parent){
  parent.appendChild(E('a-box', {
    position:'-1.8 0 0',
    width:'19.2',
    height:'0.08',
    depth:'14.2',
    color:'#050a16',
    opacity:'0.74',
    transparent:'true'
  }));

  parent.appendChild(E('a-box', {
    position:'-1.8 0.045 0',
    width:'19.35',
    height:'0.012',
    depth:'14.35',
    color:'#4fc3f7',
    opacity:'0.10',
    transparent:'true'
  }));
}

function buildGrid(parent){
  const gridGroup = E('a-entity', {id:'gridGroup'});
  parent.appendChild(gridGroup);

  for(let x=-11; x<=8; x+=1){
    gridGroup.appendChild(E('a-box', {
      position:`${x} 0.046 0`,
      width:'0.012',
      height:'0.010',
      depth:'13.5',
      color:'#1b3660',
      opacity:'0.22',
      transparent:'true'
    }));
  }

  for(let z=-7; z<=7; z+=1){
    gridGroup.appendChild(E('a-box', {
      position:`-1.8 0.047 ${z}`,
      width:'18.8',
      height:'0.010',
      depth:'0.012',
      color:'#1b3660',
      opacity:'0.22',
      transparent:'true'
    }));
  }
}

function buildPerimeter(parent){
  [
    {x:-1.8,z:-7.05,w:19.1,d:0.07},
    {x:-1.8,z: 7.05,w:19.1,d:0.07},
    {x:-11.35,z:0,w:0.07,d:14.1},
    {x: 7.75,z:0,w:0.07,d:14.1}
  ].forEach(b => {
    parent.appendChild(E('a-box', {
      position:`${b.x} 0.075 ${b.z}`,
      width:b.w,
      height:'0.055',
      depth:b.d,
      color:'#4fc3f7',
      opacity:'0.18',
      transparent:'true'
    }));
  });
}

function buildAisles(parent){
  [-2.35, 2.35].forEach(z => {
    parent.appendChild(E('a-box', {
      position:`-1.8 0.073 ${z}`,
      width:'18.5',
      height:'0.035',
      depth:'0.44',
      color:'#f39c12',
      opacity:'0.24',
      transparent:'true'
    }));
  });

  [-10.25, 7.05].forEach(x => {
    parent.appendChild(E('a-box', {
      position:`${x} 0.074 0`,
      width:'0.36',
      height:'0.035',
      depth:'13.25',
      color:'#4fc3f7',
      opacity:'0.16',
      transparent:'true'
    }));
  });
}

function buildZones(parent){
  addZone(parent,'RECIBO',-8.8,-6.32,3.2,0.9,'#55efc4');
  addZone(parent,'SURTIDO', 4.6,-6.32,4.3,0.9,'#f39c12');
  addZone(parent,'AUDITORIA',-8.8,6.32,3.7,0.9,'#9b59b6');
  addZone(parent,'EMBARQUE',4.6,6.32,4.3,0.9,'#4fc3f7');
}

function addZone(parent,label,x,z,w,d,color){
  parent.appendChild(E('a-box', {
    position:`${x} 0.082 ${z}`,
    width:w,
    height:'0.06',
    depth:d,
    color,
    opacity:'0.42',
    transparent:'true'
  }));

  parent.appendChild(E('a-text', {
    value:label,
    position:`${x - w/2 + 0.16} 0.17 ${z}`,
    rotation:'-90 0 0',
    color:'#e0eaff',
    width:'3.6'
  }));
}

function buildDocks(parent){
  for(let i=0;i<4;i++){
    const x = 2.6 + i*1.05;

    parent.appendChild(E('a-box', {
      position:`${x} 0.18 -6.88`,
      width:'0.78',
      height:'0.28',
      depth:'0.24',
      color:'#596b80',
      opacity:'0.86',
      transparent:'true'
    }));

    parent.appendChild(E('a-box', {
      position:`${x} 0.42 -7.02`,
      width:'0.72',
      height:'0.34',
      depth:'0.12',
      color:'#4fc3f7',
      opacity:'0.36',
      transparent:'true'
    }));

    parent.appendChild(E('a-box', {
      position:`${x} 0.072 -6.58`,
      width:'0.82',
      height:'0.05',
      depth:'0.12',
      color:'#f39c12',
      opacity:'0.72',
      transparent:'true'
    }));
  }
}

function buildColumns(parent){
  const cols = [
    [-9.4,-5.05],[-5.9,-5.05],[-2.4,-5.05],[1.1,-5.05],[4.6,-5.05],
    [-9.4, 0.00],[-5.9, 0.00],[-2.4, 0.00],[1.1, 0.00],[4.6, 0.00],
    [-9.4, 5.05],[-5.9, 5.05],[-2.4, 5.05],[1.1, 5.05],[4.6, 5.05]
  ];

  cols.forEach(([x,z]) => {
    parent.appendChild(E('a-cylinder', {
      position:`${x} 0.55 ${z}`,
      radius:'0.08',
      height:'1.08',
      color:'#5f7284',
      opacity:'0.72',
      transparent:'true'
    }));
  });
}

function buildRack(parent,rack){
  const group = E('a-entity', {
    id:rack.id,
    class:'rack',
    position:`${rack.x} 0 ${rack.z}`
  });

  const ratio = rack.occ / rack.cap;
  const width = rack.bays * 0.265;
  const depth = 0.82;
  const levelGap = 0.285;
  const height = rack.levels * levelGap + 0.08;
  const fColor = frameColor(ratio);
  const pColor = palletColor(ratio);

  group.appendChild(E('a-box', {
    position:'0 0.03 0',
    width:String(width + 0.16),
    height:'0.02',
    depth:String(depth + 0.12),
    color:'#000000',
    opacity:'0.18',
    transparent:'true'
  }));

  for(let i=0;i<=rack.bays;i++){
    const x = -width/2 + i*(width/rack.bays);

    [-depth/2, depth/2].forEach(z => {
      group.appendChild(E('a-box', {
        position:`${x} ${height/2} ${z}`,
        width:'0.035',
        height:String(height),
        depth:'0.035',
        color:fColor,
        opacity:'0.92',
        transparent:'true'
      }));
    });
  }

  for(let lv=0;lv<=rack.levels;lv++){
    const y = lv*levelGap + 0.04;

    [-depth/2, depth/2].forEach(z => {
      group.appendChild(E('a-box', {
        position:`0 ${y} ${z}`,
        width:String(width + 0.08),
        height:'0.030',
        depth:'0.045',
        color:'#5f7284',
        opacity:'0.88',
        transparent:'true'
      }));
    });
  }

  let occupiedLeft = rack.occ;
  const cells = [];

  for(let lv=1; lv<=rack.levels; lv++){
    for(let bay=1; bay<=rack.bays; bay++){
      const localX = -width/2 + (bay - 0.5)*(width/rack.bays);
      const cellY = (lv - 0.5)*levelGap + 0.06;
      const frontZ = -depth/2 - 0.02;
      const localCode = `${rack.id}-${lv}-${String(bay).padStart(2,'0')}`;

      if(highDetail){
        group.appendChild(E('a-box', {
          position:`${localX} ${cellY} ${frontZ}`,
          width:String((width/rack.bays)-0.035),
          height:'0.17',
          depth:'0.018',
          color:localPanelColor(),
          opacity:isHolo() ? '0.30' : '0.62',
          transparent:'true'
        }));
      }

      const occ = occupiedLeft > 0;
      if(occ) occupiedLeft--;

      if(occ){
        group.appendChild(E('a-box', {
          class:'pallet',
          position:`${localX} ${cellY - 0.012} ${-0.20}`,
          width:String((width/rack.bays)-0.06),
          height:'0.11',
          depth:'0.20',
          color:pColor,
          opacity:isHolo() ? '0.48' : '0.82',
          transparent:'true'
        }));
      }

      cells.push({level:lv,bay:bay,x:localX,y:cellY,z:-0.20,code:localCode});
      localMap.set(localCode, {rackId:rack.id, level:lv, bay:bay, x:localX, y:cellY, z:-0.20});
    }
  }

  group.appendChild(E('a-text', {
    value:rack.id,
    position:`${-width/2} ${height+0.12} ${-depth/2-0.18}`,
    rotation:'-70 0 0',
    color:'#4fc3f7',
    width:'2.0'
  }));

  group.addEventListener('click', () => highlightRack(rack.id));

  parent.appendChild(group);
  rackMap.set(rack.id,{meta:rack,group,cells});
}

function buildRoute(parent){
  const route = E('a-entity', {id:'routeGroup', visible:'false'});
  parent.appendChild(route);

  const points = [
    {x:-8.8,z:-6.2},
    {x:-8.8,z:-2.35},
    {x:-5.2,z:-2.35},
    {x:-5.2,z:0},
    {x:-5.2,z:4.8},
    {x:1.6,z:4.8},
    {x:1.6,z:2.35},
    {x:5.0,z:2.35},
    {x:5.0,z:-6.2}
  ];

  for(let i=0;i<points.length-1;i++){
    const a = points[i];
    const b = points[i+1];
    const midX = (a.x+b.x)/2;
    const midZ = (a.z+b.z)/2;
    const dx = b.x-a.x;
    const dz = b.z-a.z;
    const len = Math.sqrt(dx*dx + dz*dz);
    const rotY = Math.atan2(dx,dz)*180/Math.PI;

    route.appendChild(E('a-box', {
      position:`${midX} 0.13 ${midZ}`,
      width:'0.18',
      height:'0.05',
      depth:String(len),
      rotation:`0 ${rotY} 0`,
      color:'#f39c12',
      opacity:'0.72',
      transparent:'true'
    }));
  }
}

function applyTransforms(){
  const w = document.getElementById('warehouse');
  w.setAttribute('position',`${offsetX} 0.042 ${offsetZ}`);
  w.setAttribute('rotation',`0 ${currentRotation} 0`);
  w.setAttribute('scale',`${currentScale} ${currentScale} ${currentScale}`);
}

function clearHighlight(showMsg=true){
  document.querySelectorAll('.rack a-box').forEach(box => {
    box.removeAttribute('emissive');
    box.removeAttribute('emissiveIntensity');
  });

  let localHighlight = document.getElementById('localHighlight');
  if(localHighlight){
    localHighlight.parentNode.removeChild(localHighlight);
  }

  if(showMsg){
    updateInfo('<b>Resaltado limpio.</b><br>Busca rack, local o NP demo.');
  }
}

function highlightRack(id){
  clearHighlight(false);
  const entry = rackMap.get(id);
  if(!entry) return;

  entry.group.querySelectorAll('a-box').forEach(box => {
    box.setAttribute('emissive','#4fc3f7');
    box.setAttribute('emissiveIntensity','0.38');
  });

  const r = entry.meta;
  updateInfo(
    `<b>${r.id}</b><br>` +
    `Ocupación: <b>${r.occ}/${r.cap}</b> (${Math.round(r.occ/r.cap*100)}%)<br>` +
    `Niveles: <b>${r.levels}</b> · Locales/nivel: <b>${r.bays}</b><br>` +
    `NP demo: ${r.nps.join(', ')}`
  );
}

function highlightLocal(code){
  clearHighlight(false);

  const local = localMap.get(code);
  if(!local){
    updateInfo(`No encontré local: <b>${code}</b>`);
    return;
  }

  const rack = rackMap.get(local.rackId);
  if(!rack) return;

  rack.group.querySelectorAll('a-box').forEach(box => {
    box.setAttribute('emissive','#4fc3f7');
    box.setAttribute('emissiveIntensity','0.16');
  });

  const h = E('a-entity', {id:'localHighlight'});
  document.getElementById('warehouse').appendChild(h);

  const worldX = rack.meta.x + local.x;
  const worldY = local.y;
  const worldZ = rack.meta.z + local.z;

  h.appendChild(E('a-box', {
    position:`${worldX} ${worldY} ${worldZ}`,
    width:'0.26',
    height:'0.20',
    depth:'0.24',
    color:'#f39c12',
    opacity:'0.42',
    transparent:'true'
  }));

  h.appendChild(E('a-sphere', {
    position:`${worldX} ${worldY+0.42} ${worldZ}`,
    radius:'0.10',
    color:'#4fc3f7',
    opacity:'0.95'
  }));

  updateInfo(
    `<b>Local encontrado</b><br>` +
    `Ubicación: <b>${code}</b><br>` +
    `Rack: <b>${local.rackId}</b> · Nivel: <b>${local.level}</b> · Local: <b>${String(local.bay).padStart(2,'0')}</b>`
  );
}

function normalizeSearch(text){
  return text
    .trim()
    .toUpperCase()
    .replace(/\s+/g,'')
    .replace(/[–—]/g,'-');
}

function searchTarget(){
  const q = normalizeSearch(document.getElementById('searchInput').value);

  if(!q){
    updateInfo('Escribe un rack, local o NP demo.');
    return;
  }

  if(rackMap.has(q)){
    highlightRack(q);
    return;
  }

  if(localMap.has(q)){
    highlightLocal(q);
    return;
  }

  const inventory = {
    '98A1850':'RC07-3-05',
    '100506046':'RC10-2-04',
    '1110CR':'RC14-4-03',
    '70CR':'RC16-2-06',
    '99B5492':'RC05-1-02',
    'E7137200':'RC08-5-04'
  };

  if(inventory[q]){
    highlightLocal(inventory[q]);
    return;
  }

  const hits = RACKS.filter(r => r.nps.some(np => np.includes(q)));

  if(hits.length){
    clearHighlight(false);

    hits.forEach(r => {
      const entry = rackMap.get(r.id);
      if(entry){
        entry.group.querySelectorAll('a-box').forEach(box => {
          box.setAttribute('emissive','#55efc4');
          box.setAttribute('emissiveIntensity','0.40');
        });
      }
    });

    updateInfo(`<b>NP demo encontrado:</b> ${q}<br>Ubicaciones: <b>${hits.map(h=>h.id).join(', ')}</b>`);
    return;
  }

  updateInfo(`No encontré: <b>${q}</b>`);
}

function toggleRoute(){
  routeVisible = !routeVisible;
  const route = document.getElementById('routeGroup');
  if(route){
    route.setAttribute('visible',routeVisible ? 'true' : 'false');
  }

  updateInfo(routeVisible ? '<b>Ruta pick activa.</b><br>Recorrido ilustrativo sobre el layout.' : '<b>Ruta pick oculta.</b>');
}

function toggleHeatmap(){
  heatmap = !heatmap;
  buildWarehouse();
  applyTransforms();

  updateInfo(heatmap ? '<b>Ocupación activa.</b><br>Verde bajo, naranja medio, rojo crítico.' : '<b>Ocupación desactivada.</b>');
}

function toggleStyleMode(){
  styleMode = isHolo() ? 'realista' : 'holograma';
  buildWarehouse();
  applyTransforms();

  updateInfo(isHolo() ? '<b>Modo holograma activo.</b><br>Más brillo, transparencia y estilo AR.' : '<b>Modo realista activo.</b><br>Más sólido y operativo.');
}

function toggleDetail(){
  highDetail = !highDetail;
  buildWarehouse();
  applyTransforms();

  updateInfo(highDetail ? '<b>Detalle alto activo.</b><br>Más elementos visuales.' : '<b>Detalle bajo activo.</b><br>Mejor rendimiento en celular.');
}

function toggleWarehouse(){
  warehouseVisible = !warehouseVisible;
  document.getElementById('warehouse').setAttribute('visible',warehouseVisible ? 'true' : 'false');
  updateInfo(warehouseVisible ? '<b>Almacén visible.</b>' : '<b>Almacén oculto.</b>');
}

function toggleAnchor(){
  anchorVisible = !anchorVisible;
  document.getElementById('anchorGroup').setAttribute('visible',anchorVisible ? 'true' : 'false');
  updateInfo(anchorVisible ? '<b>Base AR visible.</b>' : '<b>Base AR oculta.</b>');
}

function scaleWarehouse(mult){
  currentScale = Math.max(0.024,Math.min(0.16,currentScale*mult));
  applyTransforms();
  updateInfo(`<b>Escala:</b> ${currentScale.toFixed(3)}`);
}

function rotateWarehouse(deg){
  currentRotation += deg;
  applyTransforms();
}

function moveWarehouse(dx,dz){
  offsetX += dx;
  offsetZ += dz;
  applyTransforms();
  updateInfo(`<b>Offset:</b> X ${offsetX.toFixed(2)} · Z ${offsetZ.toFixed(2)}`);
}

function resetWarehouse(){
  currentScale = 0.060;
  currentRotation = 0;
  offsetX = 0;
  offsetZ = 0;
  routeVisible = false;
  warehouseVisible = true;

  document.getElementById('warehouse').setAttribute('visible','true');

  buildWarehouse();
  applyTransforms();
  clearHighlight(false);

  updateInfo('<b>Vista reiniciada.</b><br>Layout centrado sobre el marcador.');
}

function hideControls(){
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('showControls').classList.add('show');
}

function showControls(){
  document.getElementById('controls').classList.remove('hidden');
  document.getElementById('showControls').classList.remove('show');
}

window.addEventListener('load', () => {
  buildWarehouse();
  applyTransforms();

  const marker = document.getElementById('hiroMarker');
  const status = document.getElementById('status');

  marker.addEventListener('markerFound', () => {
    status.textContent = 'Marcador detectado';
    status.classList.add('ok');
    updateInfo('<b>Marcador detectado.</b><br>V8.2 Paleta MiniWMS activa.');
  });

  marker.addEventListener('markerLost', () => {
    status.textContent = 'Buscando HIRO...';
    status.classList.remove('ok');
  });
});
</script>

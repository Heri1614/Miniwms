<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MiniWMS AR · V10.0 Control Tower</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  overflow:hidden;
  background:#02040a;
  font-family:'Segoe UI',Arial,sans-serif;
  color:#e0eaff;
}

#topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:90;
  padding:6px 10px;
  background:linear-gradient(180deg,rgba(5,10,22,.90),rgba(5,10,22,.45));
  border-bottom:1px solid rgba(79,195,247,.22);
  pointer-events:none;
}

#topbar h1{
  font-size:13px;
  color:#4fc3f7;
  font-weight:800;
  letter-spacing:.3px;
}

#status{
  position:fixed;
  top:44px;
  left:50%;
  transform:translateX(-50%);
  z-index:95;
  min-width:170px;
  text-align:center;
  padding:5px 12px;
  border-radius:18px;
  background:rgba(80,15,15,.82);
  border:1px solid #e74c3c;
  color:#ffb3b3;
  font-size:11px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  pointer-events:none;
}

#status.ok{
  background:rgba(7,88,48,.84);
  border-color:#27ae60;
  color:#55efc4;
}

#controls{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  z-index:100;
  padding:10px;
  border-radius:16px;
  background:rgba(5,10,22,.92);
  border:1px solid #1b3660;
  box-shadow:0 12px 30px rgba(0,0,0,.48);
  max-height:64vh;
  overflow-y:auto;
  touch-action:auto;
}

#controls.hidden{display:none}

#showControls{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:110;
  display:none;
  padding:9px 18px;
  border-radius:30px;
  border:1px solid #4fc3f7;
  background:rgba(5,10,22,.88);
  color:#4fc3f7;
  font-size:13px;
  font-weight:800;
}

#showControls.show{display:block}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:8px;
}

.mini-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:8px;
}

button{
  width:100%;
  padding:10px 7px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.68);
  color:#a8d4ff;
  font-size:12px;
  font-weight:700;
}

button:active{transform:scale(.98)}
button.primary{border-color:#4fc3f7;color:#4fc3f7}
button.green{border-color:#27ae60;color:#55efc4}
button.orange{border-color:#e67e22;color:#f39c12}
button.purple{border-color:#9b59b6;color:#d7b4ea}
button.red{border-color:#e74c3c;color:#ff9999}
button.yellow{border-color:#f1c40f;color:#ffe066}

.searchRow{
  display:flex;
  gap:8px;
  margin-top:6px;
  align-items:center;
}

.searchRow input{
  flex:1 1 auto;
  min-width:0;
  padding:10px 9px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.58);
  color:#e0eaff;
  font-size:12px;
  outline:none;
  direction:ltr;
  unicode-bidi:plaintext;
  text-align:left;
  text-transform:uppercase;
}

.searchRow button{
  flex:0 0 88px;
}

#info{
  margin-top:8px;
  padding:8px 10px;
  border-radius:12px;
  border:1px solid rgba(79,195,247,.20);
  background:rgba(12,25,55,.58);
  color:#c7dcf5;
  font-size:11.5px;
  line-height:1.45;
}

#info b{color:#4fc3f7}

#hint{
  margin-top:6px;
  color:#7fb3e0;
  font-size:9.5px;
  line-height:1.4;
}

#csvInput{display:none}
.warn{color:#ffe066}
.err{color:#ff9999}
.oktext{color:#55efc4}
</style>
</head>

<body>

<div id="topbar">
  <h1>🏭 MiniWMS AR · V10.0 Control Tower</h1>
</div>

<div id="status">Buscando HIRO...</div>

<input id="csvInput" type="file" accept=".csv,text/csv" onchange="handleCSVFile(event)">

<div id="controls">
  <div class="grid">
    <button class="primary" onclick="scaleWarehouse(1.12)">+ Acercar</button>
    <button class="primary" onclick="scaleWarehouse(0.88)">− Alejar</button>

    <button onclick="rotateWarehouse(-15)">↶ Girar</button>
    <button onclick="rotateWarehouse(15)">↷ Girar</button>

    <button class="green" onclick="toggleWarehouse()">Almacén</button>
    <button class="orange" onclick="toggleHeatmap()">Ocupación</button>

    <button class="purple" onclick="toggleRoute()">Ruta Pick</button>
    <button onclick="resetWarehouse()">Reset</button>

    <button class="primary" onclick="toggleStyleMode()">Visual</button>
    <button class="orange" onclick="toggleAnchor()">Base AR</button>

    <button class="yellow" onclick="centerWarehouse()">Centrar</button>
    <button class="yellow" onclick="comfortableView()">Vista cómoda</button>

    <button class="green" onclick="toggleSpecialRacks()">Racks especiales</button>
    <button class="purple" onclick="toggleDetail()">Detalle</button>

    <button class="green" onclick="openCSVPicker()">Cargar CSV</button>
    <button class="yellow" onclick="restoreDemoData()">Datos demo</button>

    <button class="primary" onclick="downloadCSVTemplate()">Plantilla CSV</button>
    <button class="orange" onclick="showCSVSummary()">Resumen CSV</button>

    <button class="primary" onclick="showControlTower()">Control Tower</button>
    <button class="red" onclick="clearHighlight()">Limpiar</button>
  </div>

  <div class="mini-grid">
    <button class="purple" onclick="moveWarehouse(0,-0.08)">↑</button>
    <button class="purple" onclick="moveWarehouse(-0.08,0)">←</button>
    <button class="purple" onclick="moveWarehouse(0.08,0)">→</button>
    <button class="purple" onclick="moveWarehouse(0,0.08)">↓</button>
  </div>

  <div class="searchRow">
    <input id="searchInput" placeholder="NP, LOTE, RC07, RC07-3-05" onkeydown="if(event.key==='Enter')searchTarget()">
    <button class="primary" onclick="searchTarget()">Buscar</button>
  </div>

  <div id="info">
    <b>Estado:</b> esperando marcador. Datos demo activos.
  </div>

  <div id="hint">
    CSV esperado: <b>NP, LOTE, LOCAL, QTY, BOXES, STATUS</b>.<br>
    Control Tower muestra operación, calidad, inventario detenido y condiciones de atención.
  </div>

  <div style="margin-top:8px">
    <button onclick="hideControls()">Ocultar controles</button>
  </div>
</div>

<button id="showControls" onclick="showControls()">▲ Controles</button>

<a-scene
  id="scene"
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; antialias:true; alpha:true;"
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; trackingMethod:best;">

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">

    <a-entity id="anchorGroup" visible="true">
      <a-box position="0 0.010 0" width="1.34" height="0.016" depth="1.34" color="#050a16" opacity="0.12" transparent="true"></a-box>
      <a-ring position="0 0.026 0" rotation="-90 0 0" radius-inner="0.48" radius-outer="0.56" color="#4fc3f7" opacity="0.48" transparent="true"></a-ring>
      <a-box position="0 0.029 0" width="1.02" height="0.010" depth="0.018" color="#f39c12" opacity="0.38" transparent="true"></a-box>
      <a-box position="0 0.030 0" width="0.018" height="0.010" depth="1.02" color="#f39c12" opacity="0.38" transparent="true"></a-box>
    </a-entity>

    <a-entity id="warehouse" position="0 0.042 0" rotation="0 0 0" scale="0.060 0.060 0.060" visible="true"></a-entity>

  </a-marker>

  <a-entity id="cameraRig" camera></a-entity>
</a-scene>

<script>
const SPECIAL_RACKS = ['RC05','RC10','RC14','RC16'];

const RACKS = [
  {id:'RC01', x:-8.9, z:-3.8, levels:4, bays:8, occ:22, cap:32, zone:'SURTIDO', depthType:'STD'},
  {id:'RC02', x:-6.2, z:-3.8, levels:4, bays:8, occ:26, cap:32, zone:'SURTIDO', depthType:'STD'},
  {id:'RC03', x:-3.5, z:-3.8, levels:4, bays:8, occ:14, cap:32, zone:'SURTIDO', depthType:'STD'},

  {id:'RC06', x:-8.9, z:0.0, levels:5, bays:8, occ:35, cap:40, zone:'AUDITORIA', depthType:'STD'},
  {id:'RC07', x:-6.2, z:0.0, levels:5, bays:8, occ:37, cap:40, zone:'AUDITORIA', depthType:'STD'},
  {id:'RC08', x:-3.5, z:0.0, levels:5, bays:8, occ:16, cap:40, zone:'CENTRAL', depthType:'STD'},

  {id:'RC04', x:0.2, z:-3.8, levels:4, bays:8, occ:28, cap:32, zone:'PACKING', depthType:'STD'},
  {id:'RC05', x:2.9, z:-3.8, levels:4, bays:8, occ:31, cap:32, zone:'ESPECIAL', depthType:'SPECIAL'},
  {id:'RC09', x:0.2, z:0.0, levels:5, bays:8, occ:39, cap:40, zone:'PACKING', depthType:'STD'},
  {id:'RC10', x:2.9, z:0.0, levels:5, bays:8, occ:32, cap:40, zone:'ESPECIAL', depthType:'SPECIAL'},

  {id:'RC11', x:-8.9, z:4.3, levels:4, bays:8, occ:12, cap:32, zone:'RECIBO', depthType:'STD'},
  {id:'RC12', x:-6.2, z:4.3, levels:4, bays:8, occ:29, cap:32, zone:'RECIBO', depthType:'STD'},
  {id:'RC13', x:-3.5, z:4.3, levels:4, bays:8, occ:18, cap:32, zone:'RECIBO', depthType:'STD'},

  {id:'RC14', x:0.2, z:4.3, levels:4, bays:8, occ:30, cap:32, zone:'ESPECIAL', depthType:'SPECIAL'},
  {id:'RC16', x:3.1, z:4.3, levels:5, bays:8, occ:38, cap:48, zone:'ESPECIAL', depthType:'DOUBLE'}
];

const DEMO_INVENTORY = [
  {np:'98A1850', lot:'L2401-A', local:'RC07-3-05', qty:27000, boxes:3, status:'Disponible'},
  {np:'98A1850', lot:'L2401-B', local:'RC14-2-06', qty:18000, boxes:2, status:'Picking'},
  {np:'98A1850', lot:'L2402-A', local:'RC12-4-02', qty:9000, boxes:1, status:'Auditoría'},
  {np:'100506046', lot:'L2503-X', local:'RC10-2-04', qty:12000, boxes:4, status:'Disponible'},
  {np:'100506046', lot:'L2503-Y', local:'RC04-1-07', qty:6000, boxes:2, status:'Bloqueado'},
  {np:'100506046', lot:'L2504-Z', local:'RC14-4-03', qty:9000, boxes:3, status:'Picking'},
  {np:'99B5492', lot:'L2409-C', local:'RC05-1-02', qty:15000, boxes:5, status:'Disponible'},
  {np:'E7137200', lot:'L2311-Q', local:'RC08-5-04', qty:1200, boxes:6, status:'Auditoría'},
  {np:'70CR', lot:'L2510-R', local:'RC16-2-06', qty:4800, boxes:8, status:'Disponible'},
  {np:'1110CR', lot:'L2407-M', local:'RC14-4-03', qty:3000, boxes:3, status:'Picking'},
  {np:'D3301', lot:'L2501-D', local:'RC05-3-08', qty:7500, boxes:5, status:'Bloqueado'}
];

let inventoryData = cloneInventory(DEMO_INVENTORY);
let dataSourceLabel = 'Datos demo activos';
let lastCSVSummary = null;

let rackMap = new Map();
let localMap = new Map();
let pickableEls = [];
let lastSearchResults = [];

let routeVisible = false;
let heatmap = false;
let styleMode = 'realista';
let highDetail = true;
let warehouseVisible = true;
let anchorVisible = true;
let specialVisible = false;

let currentScale = 0.060;
let currentRotation = 0;
let offsetX = 0;
let offsetZ = 0;

let selectedRackId = null;
let selectedLocalCode = null;

let touchState = null;
let suppressNextClick = false;
let raycaster = null;

function cloneInventory(arr){
  return arr.map(i => ({
    np:String(i.np || '').trim().toUpperCase(),
    lot:String(i.lot || '').trim().toUpperCase(),
    local:String(i.local || '').trim().toUpperCase(),
    qty:Number(i.qty || 0),
    boxes:Number(i.boxes || 0),
    status:normalizeStatus(i.status || 'Disponible')
  }));
}

function E(tag, attrs = {}){
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}

function updateInfo(html){
  document.getElementById('info').innerHTML = html;
}

function normalizeSearch(text){
  return String(text || '')
    .trim()
    .toUpperCase()
    .replace(/\s+/g,'')
    .replace(/[–—]/g,'-');
}

function normalizeHeader(text){
  return String(text || '')
    .trim()
    .toUpperCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,'')
    .replace(/_/g,'');
}

function normalizeStatus(status){
  const s = String(status || '')
    .trim()
    .toUpperCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');

  if(s.includes('DISP')) return 'Disponible';
  if(s.includes('PICK')) return 'Picking';
  if(s.includes('AUDIT')) return 'Auditoría';
  if(s.includes('BLOQ') || s.includes('BLOCK') || s.includes('HOLD')) return 'Bloqueado';

  return 'Disponible';
}

function getStatusColor(status){
  if(status === 'Disponible') return '#55efc4';
  if(status === 'Picking') return '#f39c12';
  if(status === 'Auditoría') return '#9b59b6';
  if(status === 'Bloqueado') return '#e74c3c';
  return '#4fc3f7';
}

function getSuggestedAction(status){
  if(status === 'Disponible') return 'Disponible para surtido o validación.';
  if(status === 'Picking') return 'Validar si ya fue solicitado o está en proceso.';
  if(status === 'Auditoría') return 'Revisar con auditor antes de mover.';
  if(status === 'Bloqueado') return 'No surtir. Revisar bloqueo/calidad.';
  return 'Revisar información en MiniWMS maestro.';
}

function isSpecialRack(id){
  return SPECIAL_RACKS.includes(id);
}

function isHolo(){
  return styleMode === 'holograma';
}

function getInventoryByLocal(local){
  return inventoryData.find(i => i.local === local);
}

function getAllInventoryByLocal(local){
  return inventoryData.filter(i => i.local === local);
}

function getInventoryByRack(rackId){
  return inventoryData.filter(i => i.local.startsWith(rackId + '-'));
}

function frameColor(ratio, rackId){
  if(specialVisible && isSpecialRack(rackId)) return '#f1c40f';

  if(heatmap){
    if(ratio >= 0.90) return '#e74c3c';
    if(ratio >= 0.70) return '#f39c12';
    return '#55efc4';
  }

  return isHolo() ? '#4fc3f7' : '#5f7284';
}

function palletColor(ratio, rackId, localCode){
  const inv = getInventoryByLocal(localCode);
  if(inv) return getStatusColor(inv.status);

  if(specialVisible && isSpecialRack(rackId)) return '#f39c12';

  if(heatmap){
    if(ratio >= 0.90) return '#e74c3c';
    if(ratio >= 0.70) return '#f39c12';
    return '#55efc4';
  }

  return isHolo() ? '#4fc3f7' : '#1e3c6e';
}

function localPanelColor(){
  return isHolo() ? '#4fc3f7' : '#0e1e38';
}

function makePickable(el, action){
  el.addEventListener('loaded', function(){
    el.object3D.userData.pickAction = action;
  });

  el.addEventListener('click', function(e){
    if(suppressNextClick){
      e.stopPropagation();
      e.preventDefault();
      return;
    }

    e.stopPropagation();
    action();
  });

  pickableEls.push(el);
  return el;
}

function getAllLayoutLocals(){
  const set = new Set();

  RACKS.forEach(rack => {
    for(let lv=1; lv<=rack.levels; lv++){
      for(let bay=1; bay<=rack.bays; bay++){
        set.add(`${rack.id}-${lv}-${String(bay).padStart(2,'0')}`);
      }
    }
  });

  return set;
}

function buildWarehouse(){
  const w = document.getElementById('warehouse');
  w.innerHTML = '';
  rackMap.clear();
  localMap.clear();
  pickableEls = [];

  buildFloor(w);
  buildGrid(w);
  buildPerimeter(w);
  buildAisles(w);
  buildZones(w);
  buildDocks(w);
  buildProcessAreas(w);
  buildColumns(w);

  RACKS.forEach(r => buildRack(w, r));

  buildRoute(w);

  w.appendChild(E('a-text', {
    value:'MiniWMS AR · V10.0 Control Tower',
    position:'-10.4 0.16 -6.85',
    rotation:'-90 0 0',
    color:'#4fc3f7',
    width:'6.4'
  }));

  restoreSelection();
}

function buildFloor(parent){
  parent.appendChild(E('a-box', {
    position:'-2.2 0 0',
    width:'20.2',
    height:'0.08',
    depth:'14.6',
    color:'#050a16',
    opacity:'0.68',
    transparent:'true'
  }));

  parent.appendChild(E('a-box', {
    position:'-2.2 0.045 0',
    width:'20.35',
    height:'0.012',
    depth:'14.75',
    color:'#4fc3f7',
    opacity:'0.10',
    transparent:'true'
  }));
}

function buildGrid(parent){
  const g = E('a-entity', {id:'gridGroup'});
  parent.appendChild(g);

  for(let x=-12; x<=8; x+=1){
    g.appendChild(E('a-box', {
      position:`${x} 0.046 0`,
      width:'0.010',
      height:'0.010',
      depth:'13.8',
      color:'#1b3660',
      opacity:'0.14',
      transparent:'true'
    }));
  }

  for(let z=-7; z<=7; z+=1){
    g.appendChild(E('a-box', {
      position:`-2.2 0.047 ${z}`,
      width:'19.8',
      height:'0.010',
      depth:'0.010',
      color:'#1b3660',
      opacity:'0.14',
      transparent:'true'
    }));
  }
}

function buildPerimeter(parent){
  [
    {x:-2.2,z:-7.15,w:20.2,d:0.07},
    {x:-2.2,z:7.15,w:20.2,d:0.07},
    {x:-12.3,z:0,w:0.07,d:14.3},
    {x:7.9,z:0,w:0.07,d:14.3}
  ].forEach(b => {
    parent.appendChild(E('a-box', {
      position:`${b.x} 0.075 ${b.z}`,
      width:b.w,
      height:'0.055',
      depth:b.d,
      color:'#4fc3f7',
      opacity:'0.18',
      transparent:'true'
    }));
  });
}

function buildAisles(parent){
  [
    {x:-2.4,z:-1.9,w:19.4,d:0.50,color:'#f39c12',op:.25},
    {x:-2.4,z:2.05,w:19.4,d:0.50,color:'#f39c12',op:.25},
    {x:-10.65,z:0,w:0.38,d:13.0,color:'#4fc3f7',op:.15},
    {x:6.35,z:0,w:0.42,d:13.0,color:'#4fc3f7',op:.15},
    {x:-0.95,z:0,w:0.35,d:13.0,color:'#55efc4',op:.12}
  ].forEach(a => {
    parent.appendChild(E('a-box', {
      position:`${a.x} 0.073 ${a.z}`,
      width:a.w,
      height:'0.035',
      depth:a.d,
      color:a.color,
      opacity:String(a.op),
      transparent:'true'
    }));
  });
}

function buildZones(parent){
  addZone(parent,'RECIBO',-9.5,6.45,3.7,0.82,'#55efc4');
  addZone(parent,'AUDITORIA',-4.8,6.45,3.6,0.82,'#9b59b6');
  addZone(parent,'SURTIDO',-7.3,-6.45,4.5,0.82,'#f39c12');
  addZone(parent,'PACKING',1.4,-6.45,4.2,0.82,'#4fc3f7');
  addZone(parent,'EMBARQUE',4.9,6.45,4.3,0.82,'#3498db');
  addZone(parent,'STAGING',0.5,6.45,3.2,0.82,'#f1c40f');
}

function addZone(parent,label,x,z,w,d,color){
  parent.appendChild(E('a-box', {
    position:`${x} 0.082 ${z}`,
    width:w,
    height:'0.06',
    depth:d,
    color,
    opacity:'0.43',
    transparent:'true'
  }));

  parent.appendChild(E('a-text', {
    value:label,
    position:`${x - w/2 + 0.16} 0.17 ${z}`,
    rotation:'-90 0 0',
    color:'#e0eaff',
    width:'3.8'
  }));
}

function buildDocks(parent){
  for(let i=0;i<5;i++){
    const x = 2.45 + i*0.95;

    parent.appendChild(E('a-box', {
      position:`${x} 0.16 6.86`,
      width:'0.68',
      height:'0.24',
      depth:'0.22',
      color:'#596b80',
      opacity:'0.86',
      transparent:'true'
    }));

    parent.appendChild(E('a-text', {
      value:`D${i+1}`,
      position:`${x-0.15} 0.62 6.72`,
      rotation:'-90 0 0',
      color:'#e0eaff',
      width:'1.0'
    }));
  }
}

function buildProcessAreas(parent){
  for(let i=0;i<4;i++){
    parent.appendChild(E('a-box', {
      position:`${-10.3 + i*0.92} 0.115 5.70`,
      width:'0.70',
      height:'0.09',
      depth:'0.42',
      color:'#55efc4',
      opacity:'0.36',
      transparent:'true'
    }));
  }

  for(let i=0;i<3;i++){
    parent.appendChild(E('a-box', {
      position:`${-5.1 + i*0.85} 0.12 5.66`,
      width:'0.62',
      height:'0.10',
      depth:'0.40',
      color:'#9b59b6',
      opacity:'0.42',
      transparent:'true'
    }));
  }

  for(let i=0;i<4;i++){
    parent.appendChild(E('a-box', {

function buildRack(parent,rack){
  const group = E('a-entity', {
    id:rack.id,
    class:'rack',
    position:`${rack.x} 0 ${rack.z}`
  });

  const ratio = rack.occ / rack.cap;
  const width = rack.bays * 0.265;
  const depth = rack.depthType === 'DOUBLE' ? 1.12 : 0.82;
  const levelGap = 0.285;
  const height = rack.levels * levelGap + 0.08;
  const fColor = frameColor(ratio, rack.id);
  const special = isSpecialRack(rack.id);

  group.appendChild(E('a-box', {
    position:'0 0.03 0',
    width:String(width + 0.16),
    height:'0.02',
    depth:String(depth + 0.12),
    color:'#000000',
    opacity:'0.18',
    transparent:'true'
  }));

  if(rack.depthType === 'DOUBLE'){
    group.appendChild(E('a-box', {
      position:'0 0.065 0',
      width:String(width + 0.22),
      height:'0.035',
      depth:String(depth + 0.28),
      color:'#f1c40f',
      opacity:'0.18',
      transparent:'true'
    }));
  }

  if(specialVisible && special){
    group.appendChild(E('a-ring', {
      position:'0 0.075 0',
      rotation:'-90 0 0',
      radiusInner:String(Math.max(width, depth) * 0.52),
      radiusOuter:String(Math.max(width, depth) * 0.67),
      color:'#f1c40f',
      opacity:'0.55',
      transparent:'true',
      animation__pulse:'property: opacity; from: 0.25; to: 0.70; dir: alternate; dur: 750; loop: true'
    }));
  }

  for(let i=0;i<=rack.bays;i++){
    const x = -width/2 + i*(width/rack.bays);

    [-depth/2, depth/2].forEach(z => {
      const post = E('a-box', {
        position:`${x} ${height/2} ${z}`,
        width:'0.035',
        height:String(height),
        depth:'0.035',
        color:fColor,
        opacity:specialVisible && special ? '1' : '0.92',
        transparent:'true'
      });

      makePickable(post, () => highlightRack(rack.id));
      group.appendChild(post);
    });

    if(rack.depthType === 'DOUBLE'){
      group.appendChild(E('a-box', {
        position:`${x} ${height/2} 0`,
        width:'0.022',
        height:String(height * 0.92),
        depth:'0.022',
        color:'#f1c40f',
        opacity:'0.55',
        transparent:'true'
      }));
    }
  }

  for(let lv=0;lv<=rack.levels;lv++){
    const y = lv*levelGap + 0.04;

    [-depth/2, depth/2].forEach(z => {
      const beam = E('a-box', {
        position:`0 ${y} ${z}`,
        width:String(width + 0.08),
        height:'0.030',
        depth:'0.045',
        color:specialVisible && special ? '#f1c40f' : '#5f7284',
        opacity:specialVisible && special ? '0.95' : '0.88',
        transparent:'true'
      });

      makePickable(beam, () => highlightRack(rack.id));
      group.appendChild(beam);
    });
  }

  let occupiedLeft = rack.occ;
  const cells = [];

  for(let lv=1; lv<=rack.levels; lv++){
    for(let bay=1; bay<=rack.bays; bay++){
      const localX = -width/2 + (bay - 0.5)*(width/rack.bays);
      const cellY = (lv - 0.5)*levelGap + 0.06;
      const localCode = `${rack.id}-${lv}-${String(bay).padStart(2,'0')}`;
      const inv = getInventoryByLocal(localCode);

      if(highDetail){
        const localPanel = E('a-box', {
          position:`${localX} ${cellY} ${-depth/2 - 0.02}`,
          width:String((width/rack.bays)-0.035),
          height:'0.17',
          depth:'0.035',
          color:inv ? getStatusColor(inv.status) : localPanelColor(),
          opacity:inv ? '0.48' : (isHolo() ? '0.30' : '0.62'),
          transparent:'true'
        });

        makePickable(localPanel, () => highlightLocal(localCode));
        group.appendChild(localPanel);
      }

      const occ = occupiedLeft > 0;
      if(occ) occupiedLeft--;

      if(occ){
        const palletZ = rack.depthType === 'DOUBLE' && bay % 2 === 0 ? 0.14 : -0.22;

        const palletBox = E('a-box', {
          class:'pallet',
          position:`${localX} ${cellY - 0.012} ${palletZ}`,
          width:String((width/rack.bays)-0.06),
          height:'0.11',
          depth:rack.depthType === 'DOUBLE' ? '0.24' : '0.20',
          color:palletColor(ratio, rack.id, localCode),
          opacity:isHolo() ? '0.48' : '0.82',
          transparent:'true'
        });

        makePickable(palletBox, () => highlightLocal(localCode));
        group.appendChild(palletBox);
      }

      cells.push({level:lv,bay:bay,x:localX,y:cellY,z:-0.20,code:localCode});
      localMap.set(localCode, {rackId:rack.id, level:lv, bay:bay, x:localX, y:cellY, z:-0.20});
    }
  }

  group.appendChild(E('a-text', {
    value:rack.depthType === 'DOUBLE' ? `${rack.id} DP` : (special ? `${rack.id} *` : rack.id),
    position:`${-width/2} ${height+0.12} ${-depth/2-0.18}`,
    rotation:'-90 0 0',
    color:rack.depthType === 'DOUBLE' ? '#f1c40f' : (special ? '#f1c40f' : '#4fc3f7'),
    width:'2.0'
  }));

  parent.appendChild(group);
  rackMap.set(rack.id,{meta:rack,group,cells});
}

function buildRoute(parent){
  const route = E('a-entity', {id:'routeGroup', visible:'false'});
  parent.appendChild(route);

  const points = [
    {x:-9.5,z:6.1},
    {x:-9.5,z:2.05},
    {x:-6.2,z:2.05},
    {x:-6.2,z:0},
    {x:-6.2,z:-1.9},
    {x:-0.95,z:-1.9},
    {x:-0.95,z:-5.8},
    {x:1.4,z:-5.8},
    {x:4.9,z:6.1}
  ];

  for(let i=0;i<points.length-1;i++){
    const a = points[i];
    const b = points[i+1];
    const midX = (a.x+b.x)/2;
    const midZ = (a.z+b.z)/2;
    const dx = b.x-a.x;
    const dz = b.z-a.z;
    const len = Math.sqrt(dx*dx + dz*dz);
    const rotY = Math.atan2(dx,dz)*180/Math.PI;

    route.appendChild(E('a-box', {
      position:`${midX} 0.13 ${midZ}`,
      width:'0.18',
      height:'0.05',
      depth:String(len),
      rotation:`0 ${rotY} 0`,
      color:'#f39c12',
      opacity:'0.72',
      transparent:'true'
    }));
  }
}

function handleCSVFile(event){
  const file = event.target.files && event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    try{
      const parsed = parseCSVInventory(e.target.result);

      if(!parsed.rows.length){
        updateInfo('<b>Error CSV:</b> no encontré registros válidos.<br>Revisa columnas: NP, LOTE, LOCAL, QTY, BOXES, STATUS.');
        return;
      }

      inventoryData = parsed.rows;
      dataSourceLabel = `Datos cargados desde CSV: ${file.name}`;
      lastCSVSummary = buildCSVSummary(inventoryData, parsed.validation, file.name);

      selectedRackId = null;
      selectedLocalCode = null;
      lastSearchResults = [];

      buildWarehouse();
      applyTransforms();

      updateInfo(formatCSVSummary(lastCSVSummary, true));
    }catch(err){
      updateInfo(`<b>Error al leer CSV:</b><br>${err.message}`);
    }
  };

  reader.onerror = function(){
    updateInfo('<b>Error:</b> no pude leer el archivo CSV.');
  };

  reader.readAsText(file, 'UTF-8');
}

function parseCSVInventory(text){
  const clean = String(text || '').replace(/^\uFEFF/, '');
  const lines = clean.split(/\r?\n/).filter(line => line.trim() !== '');

  if(lines.length < 2){
    throw new Error('El CSV no tiene filas suficientes.');
  }

  const headers = parseCSVLine(lines[0]).map(normalizeHeader);

  const idxNP = findHeaderIndex(headers, ['NP','ITEM','PARTNUMBER','PARTNO','MATERIAL']);
  const idxLot = findHeaderIndex(headers, ['LOTE','LOT','LOTSERIAL','LOTSERIALNUMBER','LOTNUMBER','SERIAL']);
  const idxLocal = findHeaderIndex(headers, ['LOCAL','LOCATION','LOCACION','UBICACION','RACKLOCAL','BIN']);
  const idxQty = findHeaderIndex(headers, ['QTY','QUANTITY','CANTIDAD','PCS']);
  const idxBoxes = findHeaderIndex(headers, ['BOXES','BOX','CAJAS']);
  const idxStatus = findHeaderIndex(headers, ['STATUS','ESTADO','LOTSTATUS','ESTATUS']);

  const missing = [];
  if(idxNP < 0) missing.push('NP');
  if(idxLot < 0) missing.push('LOTE');
  if(idxLocal < 0) missing.push('LOCAL');

  if(missing.length){
    throw new Error('Faltan columnas obligatorias: ' + missing.join(', '));
  }

  const rows = [];
  const validation = {
    invalidLocals: [],
    skippedRows: 0
  };

  const validLocals = getAllLayoutLocals();

  for(let i=1; i<lines.length; i++){
    const cols = parseCSVLine(lines[i]);

    const np = String(cols[idxNP] || '').trim().toUpperCase();
    const lot = String(cols[idxLot] || '').trim().toUpperCase();
    const local = normalizeLocal(cols[idxLocal]);

    if(!np || !lot || !local){
      validation.skippedRows++;
      continue;
    }

    const record = {
      np,
      lot,
      local,
      qty:idxQty >= 0 ? toNumber(cols[idxQty]) : 0,
      boxes:idxBoxes >= 0 ? toNumber(cols[idxBoxes]) : 0,
      status:idxStatus >= 0 ? normalizeStatus(cols[idxStatus]) : 'Disponible'
    };

    rows.push(record);

    if(!validLocals.has(local)){
      validation.invalidLocals.push(local);
    }
  }

  validation.invalidLocals = [...new Set(validation.invalidLocals)];

  return {rows, validation};
}

function parseCSVLine(line){
  const result = [];
  let current = '';
  let insideQuotes = false;

  for(let i=0; i<line.length; i++){
    const char = line[i];
    const next = line[i+1];

    if(char === '"' && insideQuotes && next === '"'){
      current += '"';
      i++;
      continue;
    }

    if(char === '"'){
      insideQuotes = !insideQuotes;
      continue;
    }

    if(char === ',' && !insideQuotes){
      result.push(current.trim());
      current = '';
      continue;
    }

    current += char;
  }

  result.push(current.trim());
  return result;
}

function findHeaderIndex(headers, options){
  return headers.findIndex(h => options.includes(h));
}

function normalizeLocal(value){
  return String(value || '')
    .trim()
    .toUpperCase()
    .replace(/\s+/g,'')
    .replace(/[–—]/g,'-');
}

function toNumber(value){
  const n = Number(String(value || '').replace(/,/g,'').trim());
  return Number.isFinite(n) ? n : 0;
}

function buildCSVSummary(rows, validation, fileName){
  const npSet = new Set();
  const lotSet = new Set();
  let qtyTotal = 0;
  let boxesTotal = 0;

  const statusCount = {
    Disponible: 0,
    Picking: 0,
    Auditoría: 0,
    Bloqueado: 0
  };

  rows.forEach(r => {
    npSet.add(r.np);
    lotSet.add(r.lot);
    qtyTotal += Number(r.qty || 0);
    boxesTotal += Number(r.boxes || 0);
    statusCount[r.status] = (statusCount[r.status] || 0) + 1;
  });

  return {
    fileName: fileName || 'Datos demo',
    rows: rows.length,
    uniqueNP: npSet.size,
    uniqueLots: lotSet.size,
    qtyTotal,
    boxesTotal,
    statusCount,
    invalidLocals: validation.invalidLocals || [],
    skippedRows: validation.skippedRows || 0,
    source: dataSourceLabel
  };
}

function formatCSVSummary(summary, loadedNow=false){
  if(!summary){
    return '<b>Resumen CSV:</b><br>No hay resumen disponible.';
  }

  const invalid = summary.invalidLocals.length
    ? `<br><span class="err"><b>Ubicaciones fuera del layout:</b> ${summary.invalidLocals.slice(0,8).join(', ')}${summary.invalidLocals.length>8?'...':''}</span>`
    : '<br><span class="oktext"><b>Ubicaciones:</b> todas coinciden con el layout.</span>';

  const skipped = summary.skippedRows
    ? `<br><span class="warn"><b>Filas omitidas:</b> ${summary.skippedRows}</span>`
    : '';

  return (
    `${loadedNow ? '<b>CSV cargado correctamente.</b>' : '<b>Resumen CSV / Datos activos</b>'}<br>` +
    `Archivo/Fuente: <b>${summary.fileName}</b><br>` +
    `Registros: <b>${summary.rows}</b> · NP únicos: <b>${summary.uniqueNP}</b> · Lotes únicos: <b>${summary.uniqueLots}</b><br>` +
    `Qty total: <b>${summary.qtyTotal}</b> · Boxes total: <b>${summary.boxesTotal}</b><br>` +
    `Disponible: <b style="color:${getStatusColor('Disponible')}">${summary.statusCount.Disponible || 0}</b> · ` +
    `Picking: <b style="color:${getStatusColor('Picking')}">${summary.statusCount.Picking || 0}</b> · ` +
    `Auditoría: <b style="color:${getStatusColor('Auditoría')}">${summary.statusCount.Auditoría || 0}</b> · ` +
    `Bloqueado: <b style="color:${getStatusColor('Bloqueado')}">${summary.statusCount.Bloqueado || 0}</b>` +
    invalid +
    skipped
  );
}

function validateInvalidLocals(rows){

  const invalid = rows.filter(r => !validLocals.has(r.local)).map(r => r.local);
  return [...new Set(invalid)];
}

function downloadCSVTemplate(){
  const csv = [
    ['NP','LOTE','LOCAL','QTY','BOXES','STATUS'],
    ['98A1850','L2401-A','RC07-3-05','27000','3','Disponible'],
    ['100506046','L2503-X','RC10-2-04','12000','4','Disponible'],
    ['D3301','L2501-D','RC05-3-08','7500','5','Bloqueado'],
    ['70CR','L2510-R','RC16-2-06','4800','8','Disponible']
  ].map(row => row.map(csvEscape).join(',')).join('\n');

  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = 'MiniWMS_AR_Template.csv';
  document.body.appendChild(a);
  a.click();

  updateInfo('<b>Plantilla CSV generada.</b><br>Descarga: <b>MiniWMS_AR_Template.csv</b>');
}

function csvEscape(value){
  const s = String(value ?? '');
  if(/[",\n\r]/.test(s)){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}

function getControlTowerMetrics(){
  const validLocals = getAllLayoutLocals();

  const npSet = new Set();
  const lotSet = new Set();

  let totalQty = 0;
  let totalBoxes = 0;

  let auditQty = 0;
  let auditBoxes = 0;
  let blockedQty = 0;
  let blockedBoxes = 0;

  const statusCount = {
    Disponible: 0,
    Picking: 0,
    Auditoría: 0,
    Bloqueado: 0
  };

  const invalidLocationRecords = [];
  const attentionRecords = [];

  inventoryData.forEach(item => {
    npSet.add(item.np);
    lotSet.add(item.lot);

    totalQty += Number(item.qty || 0);
    totalBoxes += Number(item.boxes || 0);

    if(statusCount[item.status] === undefined){
      statusCount[item.status] = 0;
    }

    statusCount[item.status]++;

    const invalidLocal = !validLocals.has(item.local);

    if(item.status === 'Auditoría'){
      auditQty += Number(item.qty || 0);
      auditBoxes += Number(item.boxes || 0);
    }

    if(item.status === 'Bloqueado'){
      blockedQty += Number(item.qty || 0);
      blockedBoxes += Number(item.boxes || 0);
    }

    if(invalidLocal){
      invalidLocationRecords.push(item);
    }

    if(item.status === 'Auditoría' || item.status === 'Bloqueado' || invalidLocal){
      attentionRecords.push(item);
    }
  });

  const totalRecords = inventoryData.length;
  const attentionPercent = totalRecords
    ? Math.round((attentionRecords.length / totalRecords) * 100)
    : 0;

  return {
    totalRecords,
    uniqueNP: npSet.size,
    uniqueLots: lotSet.size,
    totalQty,
    totalBoxes,
    statusCount,
    auditQty,
    auditBoxes,
    blockedQty,
    blockedBoxes,
    invalidLocationsCount: invalidLocationRecords.length,
    invalidLocationRecords,
    attentionRecords,
    attentionPercent
  };
}

  );

function buildControlTowerPins(records){
  const w = document.getElementById('warehouse');
  const old = document.getElementById('searchResultsGroup');

  if(old){
    old.parentNode.removeChild(old);
  }

  const group = E('a-entity', {id:'searchResultsGroup'});
  w.appendChild(group);

  if(!records.length){
    return;
  }

  records.forEach((item, index) => {
    const local = localMap.get(item.local);

    if(!local){
      return;
    }

    const rack = rackMap.get(local.rackId);

    if(!rack){
      return;
    }

    const validLocals = getAllLayoutLocals();
    const isInvalid = !validLocals.has(item.local);
    const color = isInvalid ? '#ff9999' : getStatusColor(item.status);

    const x = rack.meta.x + local.x;
    const y = local.y + 0.42;
    const z = rack.meta.z + local.z;

    group.appendChild(E('a-sphere', {
      position:`${x} ${y} ${z}`,
      radius:'0.14',
      color,
      opacity:'0.98',
      animation__pulse:'property: scale; from: 1 1 1; to: 1.45 1.45 1.45; dir: alternate; dur: 600; loop: true'
    }));

    group.appendChild(E('a-cylinder', {
      position:`${x} ${y-0.24} ${z}`,
      radius:'0.026',
      height:'0.44',
      color,
      opacity:'0.82',
      transparent:'true'
    }));

    group.appendChild(E('a-text', {
      value:String(index + 1),
      position:`${x-0.055} ${y+0.18} ${z}`,
      rotation:'-90 0 0',
      color:'#ffffff',
      width:'1.4'
    }));
  });
}

      animation__pulse:'property: scale; from: 1 1 1; to: 1.4 1.4 1.4; dir: alternate; dur: 600; loop: true'
    }));

    group.appendChild(E('a-text', {
      value:`${index+1}`,
      position:`${x-0.05} ${y+0.17} ${z}`,
      rotation:'-90 0 0',
      color:'#ffffff',
      width:'1.3'
    }));
  });
}

function clearResultPins(){
  const old = document.getElementById('searchResultsGroup');
  if(old) old.parentNode.removeChild(old);
}

function applyTransforms(){
  const w = document.getElementById('warehouse');
  w.setAttribute('position',`${offsetX} 0.042 ${offsetZ}`);
  w.setAttribute('rotation',`0 ${currentRotation} 0`);
  w.setAttribute('scale',`${currentScale} ${currentScale} ${currentScale}`);
}

function clearHighlight(showMsg=true){
  document.querySelectorAll('.rack a-box').forEach(box => {
    box.removeAttribute('emissive');
    box.removeAttribute('emissiveIntensity');
    box.removeAttribute('animation__pulse');
  });

  const localHighlight = document.getElementById('localHighlight');
  if(localHighlight) localHighlight.parentNode.removeChild(localHighlight);

  clearResultPins();

  selectedRackId = null;
  selectedLocalCode = null;
  lastSearchResults = [];

  if(showMsg){
    updateInfo(`<b>Resaltado limpio.</b><br>${dataSourceLabel}.`);
  }
}

function restoreSelection(){
  if(selectedLocalCode && localMap.has(selectedLocalCode)){
    highlightLocal(selectedLocalCode, true);
    return;
  }

  if(selectedRackId && rackMap.has(selectedRackId)){
    highlightRack(selectedRackId, true);
  }
}

function highlightRack(id, silent=false){
  clearHighlight(false);
  selectedRackId = id;
  selectedLocalCode = null;

  const entry = rackMap.get(id);
  if(!entry) return;

  entry.group.querySelectorAll('a-box').forEach(box => {
    box.setAttribute('emissive', isSpecialRack(id) ? '#f1c40f' : '#4fc3f7');
    box.setAttribute('emissiveIntensity','0.50');
  });

  const ring = E('a-ring', {
    id:'localHighlight',
    position:`${entry.meta.x} 0.12 ${entry.meta.z}`,
    rotation:'-90 0 0',
    radiusInner:'0.62',
    radiusOuter:'0.76',
    color:isSpecialRack(id) ? '#f1c40f' : '#4fc3f7',
    opacity:'0.72',
    transparent:'true',
    animation__pulse:'property: opacity; from: 0.28; to: 0.78; dir: alternate; dur: 650; loop: true'
  });

  document.getElementById('warehouse').appendChild(ring);

  const r = entry.meta;
  const pct = Math.round(r.occ/r.cap*100);
  const items = getInventoryByRack(r.id);
  const typeText = r.depthType === 'DOUBLE'
    ? '<br><b>Tipo:</b> Rack doble profundidad / especial'
    : (isSpecialRack(r.id) ? '<br><b>Tipo:</b> Rack especial / lógica prioritaria' : '');

  if(!silent){
    updateInfo(
      `<b>Rack seleccionado:</b> ${r.id}<br>` +
      `Zona: <b>${r.zone}</b>${typeText}<br>` +
      `Ocupación layout: <b>${r.occ}/${r.cap}</b> · <b>${pct}%</b><br>` +
      `Registros cargados en rack: <b>${items.length}</b><br>` +
      `<span style="color:#7fb3e0">${dataSourceLabel}</span>`
    );
  }
}

function highlightLocal(code, silent=false){
  clearHighlight(false);
  selectedLocalCode = code;

  const local = localMap.get(code);
  if(!local){
    updateInfo(`No encontré local: <b>${code}</b>`);
    return;
  }

  selectedRackId = local.rackId;

  const rack = rackMap.get(local.rackId);
  if(!rack) return;

  rack.group.querySelectorAll('a-box').forEach(box => {
    box.setAttribute('emissive','#4fc3f7');
    box.setAttribute('emissiveIntensity','0.18');
  });

  const items = getAllInventoryByLocal(code);
  const inv = items[0];
  const color = inv ? getStatusColor(inv.status) : '#f39c12';

  const h = E('a-entity', {id:'localHighlight'});
  document.getElementById('warehouse').appendChild(h);

  const worldX = rack.meta.x + local.x;
  const worldY = local.y;
  const worldZ = rack.meta.z + local.z;

  h.appendChild(E('a-box', {
    position:`${worldX} ${worldY} ${worldZ}`,
    width:'0.30',
    height:'0.24',
    depth:'0.28',
    color,
    opacity:'0.52',
    transparent:'true',
    animation__pulse:'property: opacity; from: 0.25; to: 0.68; dir: alternate; dur: 650; loop: true'
  }));

  h.appendChild(E('a-sphere', {
    position:`${worldX} ${worldY+0.42} ${worldZ}`,
    radius:'0.11',
    color,
    opacity:'0.95'
  }));

  if(!silent){
    if(inv){
      const multiNote = items.length > 1
        ? `<br><span class="warn">Nota: este local tiene <b>${items.length}</b> registros cargados. En esta operación puede ser válido.</span>`
        : '';

      updateInfo(
        `<b>Local seleccionado:</b> ${code}<br>` +
        `Rack: <b>${local.rackId}</b> · Zona: <b>${rack.meta.zone}</b><br>` +
        `NP: <b>${inv.np}</b> · Lote: <b>${inv.lot}</b><br>` +
        `Qty: <b>${inv.qty}</b> · Boxes: <b>${inv.boxes}</b><br>` +
        `Estado: <b style="color:${color}">${inv.status}</b><br>` +
        `Acción: ${getSuggestedAction(inv.status)}` +
        multiNote +
        `<br><span style="color:#7fb3e0">${dataSourceLabel}</span>`
      );
    }else{
      updateInfo(
        `<b>Local seleccionado:</b> ${code}<br>` +
        `Rack: <b>${local.rackId}</b> · Zona: <b>${rack.meta.zone}</b><br>` +
        `Sin inventario cargado para este local.<br>` +
        `Acción: revisar local en MiniWMS maestro.`
      );
    }
  }
}

function searchTarget(){
  const q = normalizeSearch(document.getElementById('searchInput').value);

  if(!q){
    updateInfo('Escribe NP, lote, rack o local.');
    return;
  }

  if(rackMap.has(q)){
    highlightRack(q);
    return;
  }

  if(localMap.has(q)){
    highlightLocal(q);
    return;
  }

  const hits = inventoryData.filter(i =>
    normalizeSearch(i.np) === q ||
    normalizeSearch(i.lot) === q ||
    normalizeSearch(i.local) === q ||
    normalizeSearch(i.np).includes(q) ||
    normalizeSearch(i.lot).includes(q)
  );

  if(hits.length === 1){
    lastSearchResults = hits;
    highlightLocal(hits[0].local);
    buildResultPins(hits);
    return;
  }

  if(hits.length > 1){
    clearHighlight(false);
    lastSearchResults = hits;
    buildResultPins(hits);

    hits.forEach(item => {
      const local = localMap.get(item.local);
      if(!local) return;
      const rack = rackMap.get(local.rackId);
      if(!rack) return;

      rack.group.querySelectorAll('a-box').forEach(box => {
        box.setAttribute('emissive', getStatusColor(item.status));
        box.setAttribute('emissiveIntensity','0.42');
      });
    });

    const rows = hits.map((h, idx) =>
      `${idx+1}) <b>${h.local}</b> · ${h.lot} · ${h.qty} pcs · <span style="color:${getStatusColor(h.status)}">${h.status}</span>`
    ).join('<br>');

    updateInfo(
      `<b>Búsqueda:</b> ${q}<br>` +
      `Resultados: <b>${hits.length}</b><br>` +
      rows +
      `<br><br><span style="color:#7fb3e0">${dataSourceLabel}</span>`
    );

    return;
  }

  updateInfo(`No encontré: <b>${q}</b><br>Revisa CSV o prueba: 98A1850, L2401-A, RC07-3-05.`);
}

function getTouchDistance(t1,t2){
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function getTouchMidpoint(t1,t2){
  return {
    x:(t1.clientX + t2.clientX)/2,
    y:(t1.clientY + t2.clientY)/2
  };
}

function getCanvasPoint(clientX, clientY){
  const scene = document.getElementById('scene');
  const canvas = scene.canvas;
  const rect = canvas.getBoundingClientRect();

  return {
    x:((clientX - rect.left) / rect.width) * 2 - 1,
    y:-((clientY - rect.top) / rect.height) * 2 + 1
  };
}

function getPickActionFromObject(obj){
  let current = obj;

  while(current){
    if(current.userData && current.userData.pickAction){
      return current.userData.pickAction;
    }
    current = current.parent;
  }

  return null;
}

function pickByRay(clientX, clientY){
  const scene = document.getElementById('scene');
  if(!scene || !scene.camera || !scene.canvas) return false;

  if(!raycaster) raycaster = new THREE.Raycaster();

  const ndc = getCanvasPoint(clientX, clientY);
  raycaster.setFromCamera(ndc, scene.camera);

  const objects = pickableEls.filter(el => el && el.object3D).map(el => el.object3D);
  const hits = raycaster.intersectObjects(objects, true);

  for(let i=0; i<hits.length; i++){
    const action = getPickActionFromObject(hits[i].object);
    if(action){
      action();
      return true;
    }
  }

  return false;
}

function pickNearestRack(clientX, clientY){
  const scene = document.getElementById('scene');
  if(!scene || !scene.camera || !scene.canvas) return false;

  const canvas = scene.canvas;
  const rect = canvas.getBoundingClientRect();
  let bestRack = null;
  let bestDist = Infinity;

  rackMap.forEach((entry, id) => {
    if(!entry.group || !entry.group.object3D) return;

    const pos = new THREE.Vector3();
    entry.group.object3D.getWorldPosition(pos);
    pos.project(scene.camera);

    const sx = rect.left + (pos.x + 1) * rect.width / 2;
    const sy = rect.top + (-pos.y + 1) * rect.height / 2;

    const dx = sx - clientX;
    const dy = sy - clientY;
    const d = Math.sqrt(dx*dx + dy*dy);

    if(d < bestDist){
      bestDist = d;
      bestRack = id;
    }
  });

  if(bestRack && bestDist < 135){
    highlightRack(bestRack);
    return true;
  }

  return false;
}

function selectFromTap(clientX, clientY){
  if(pickByRay(clientX, clientY)) return;
  if(!pickNearestRack(clientX, clientY)){
    updateInfo('<b>Selección:</b> no detecté rack en ese toque.<br>Acércate o usa búsqueda.');
  }
}

function bindSafeTouchControls(){
  const scene = document.getElementById('scene');

  function attach(){
    const canvas = scene.canvas;

    if(!canvas){
      setTimeout(attach,300);
      return;
    }

    canvas.style.touchAction = 'none';

    canvas.addEventListener('touchstart', function(e){
      if(e.touches.length === 1){
        const t = e.touches[0];

        touchState = {
          mode:'rotate',
          startX:t.clientX,
          startY:t.clientY,
          startRotation:currentRotation,
          moved:false
        };
      }

      if(e.touches.length === 2){
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const mid = getTouchMidpoint(t1,t2);

        touchState = {
          mode:'pinch',
          startDistance:getTouchDistance(t1,t2),
          startScale:currentScale,
          startMidX:mid.x,
          startMidY:mid.y,
          startOffsetX:offsetX,
          startOffsetZ:offsetZ,
          moved:true
        };
      }
    }, {passive:false});

    canvas.addEventListener('touchmove', function(e){
      if(!touchState) return;
      e.preventDefault();

      if(touchState.mode === 'rotate' && e.touches.length === 1){
        const t = e.touches[0];
        const dx = t.clientX - touchState.startX;
        const dy = t.clientY - touchState.startY;

        if(Math.abs(dx) > 4 || Math.abs(dy) > 4){
          touchState.moved = true;
          suppressNextClick = true;
        }

        currentRotation = touchState.startRotation + dx * 0.22;
        applyTransforms();
      }

      if(touchState.mode === 'pinch' && e.touches.length === 2){
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const dist = getTouchDistance(t1,t2);
        const mid = getTouchMidpoint(t1,t2);
        const ratio = dist / Math.max(1,touchState.startDistance);

        currentScale = Math.max(0.024,Math.min(0.16,touchState.startScale * ratio));
        offsetX = touchState.startOffsetX + (mid.x - touchState.startMidX) * 0.004;
        offsetZ = touchState.startOffsetZ + (mid.y - touchState.startMidY) * 0.004;

        suppressNextClick = true;
        applyTransforms();
      }
    }, {passive:false});

    canvas.addEventListener('touchend', function(e){
      if(touchState && touchState.mode === 'rotate' && !touchState.moved){
        const t = e.changedTouches && e.changedTouches[0];
        if(t) selectFromTap(t.clientX, t.clientY);
      }

      if(touchState && touchState.moved){
        suppressNextClick = true;
        setTimeout(function(){ suppressNextClick = false; },250);
      }

      touchState = null;
    }, {passive:true});
  }

  if(scene.hasLoaded) attach();
  else scene.addEventListener('loaded', attach);
}

window.addEventListener('load', () => {

  marker.addEventListener('markerFound', () => {
    status.textContent = 'Marcador detectado';
    status.classList.add('ok');
    updateInfo(`<b>Marcador detectado.</b><br>V10.0 Control Tower activo.<br><span style="color:#7fb3e0">${dataSourceLabel}</span>`);
  });

  marker.addEventListener('markerLost', () => {
    status.textContent = 'Buscando HIRO...';
    status.classList.remove('ok');
  });
});

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MiniWMS AR · V10.1 Cámara Limpia</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:'Segoe UI',Arial,sans-serif;
  color:#e0eaff;
  -webkit-user-select:none;
  user-select:none;
}

body{
  touch-action:none;
}

/* Solo indicador pequeño, no tapa cámara */
#miniStatus{
  position:fixed;
  top:12px;
  left:12px;
  z-index:80;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#e74c3c;
  box-shadow:0 0 12px #e74c3c;
}

#miniStatus.ok{
  background:#55efc4;
  box-shadow:0 0 14px #55efc4;
}

/* Botón flotante inferior */
#showControls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:90;
  padding:12px 28px;
  border-radius:999px;
  border:1px solid #4fc3f7;
  background:rgba(5,10,22,.88);
  color:#4fc3f7;
  font-size:17px;
  font-weight:800;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
}

#showControls.hidden{
  display:none;
}

#controls{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:100;
  padding:12px;
  border-radius:18px;
  background:rgba(5,10,22,.94);
  border:1px solid #1b3660;
  box-shadow:0 18px 46px rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  max-height:68vh;
  overflow-y:auto;
  display:none;
}

#controls.open{
  display:block;
}

#controls::-webkit-scrollbar{
  width:4px;
}

#controls::-webkit-scrollbar-thumb{
  background:#1b3660;
  border-radius:4px;
}

.panelTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:4px 4px 10px;
  margin-bottom:10px;
  border-bottom:1px solid #1b3660;
}

.panelTitle h1{
  font-size:15px;
  color:#4fc3f7;
  letter-spacing:.7px;
}

.panelTitle p{
  font-size:10.5px;
  color:#7fb3e0;
  margin-top:2px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:9px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:9px;
}

button{
  width:100%;
  min-height:46px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(30,60,110,.50);
  color:#a8d4ff;
  font-size:13px;
  font-weight:700;
  outline:none;
}

button:active{
  transform:scale(.98);
}

button.primary{
  border-color:#4fc3f7;
  color:#4fc3f7;
  background:rgba(15,50,100,.50);
}

button.success{
  border-color:#27ae60;
  color:#55efc4;
}

button.warn{
  border-color:#e67e22;
  color:#f39c12;
}

button.danger{
  border-color:#922;
  color:#ff6b6b;
}

button.purple{
  border-color:#9b59b6;
  color:#d7b4ea;
}

.searchRow{
  display:grid;
  grid-template-columns:1fr 96px;
  gap:8px;
  margin-bottom:9px;
}

#searchInput{
  min-height:46px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.45);
  color:#e0eaff;
  padding:0 12px;
  font-size:13px;
  outline:none;
  direction:ltr;
  unicode-bidi:plaintext;
  text-align:left;
  text-transform:uppercase;
}

#searchInput:focus{
  border-color:#4fc3f7;
}

#searchInput::placeholder{
  color:#627d9c;
}

#info{
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.45);
  color:#cfe2ff;
  font-size:12px;
  line-height:1.55;
  margin-bottom:9px;
}

#info b{
  color:#4fc3f7;
}

.hint{
  font-size:10.5px;
  color:#7fb3e0;
  line-height:1.45;
}

a-scene{
  width:100vw!important;
  height:100vh!important;
}
</style>
</head>

<body>

<div id="miniStatus"></div>

<button id="showControls">▲ Controles</button>

<div id="controls">
  <div class="panelTitle">
    <div>
      <h1>🏭 MiniWMS AR · V10.1</h1>
      <p>Cámara limpia · paleta MiniWMS</p>
    </div>
    <button class="danger" style="width:70px;min-height:34px" onclick="hidePanel()">Cerrar</button>
  </div>

  <div class="grid2">
    <button class="primary" onclick="scaleModel(1.12)">+ Acercar</button>
    <button class="primary" onclick="scaleModel(0.88)">− Alejar</button>
    <button onclick="rotateModel(-12)">↶ Girar</button>
    <button onclick="rotateModel(12)">↷ Girar</button>
    <button class="success" onclick="setMode('normal')">Almacén</button>
    <button class="warn" onclick="setMode('occupancy')">Ocupación</button>
    <button class="purple" onclick="toggleRoute()">Ruta Pick</button>
    <button onclick="resetView()">Reset</button>
  </div>

  <div class="grid4">
    <button class="purple" onclick="moveModel(0,-0.06)">↑</button>
    <button class="purple" onclick="moveModel(-0.06,0)">←</button>
    <button class="purple" onclick="moveModel(0.06,0)">→</button>
    <button class="purple" onclick="moveModel(0,0.06)">↓</button>
  </div>

  <div class="grid2">
    <button class="primary" onclick="toggleBase()">Base AR</button>
    <button class="primary" onclick="toggleLabels()">Labels</button>
    <button class="warn" onclick="toggleDetail()">Detalle</button>
    <button class="danger" onclick="clearSelection()">Limpiar</button>
  </div>

  <div class="searchRow">
    <input id="searchInput" placeholder="RC07, RC07-3-05, 98A1850">
    <button class="primary" onclick="searchTarget()">Buscar</button>
  </div>

  <div id="info">
    <b>Estado:</b> esperando marcador HIRO.
  </div>

  <div class="hint">
    Con controles ocultos: un dedo gira. Dos dedos acercan o desplazan. Toca un rack/local para seleccionar.
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="antialias:true; alpha:true; logarithmicDepthBuffer:true; precision:medium;"
  arjs="sourceType:webcam; debugUIEnabled:false; trackingMethod:best;">

  <a-marker id="marker" preset="hiro" emitevents="true">

    <a-entity id="arRoot" position="0 0.025 0" rotation="0 0 0" scale="0.46 0.46 0.46">

      <a-entity id="baseGroup">
        <!-- Base transparente: ya no tapa cámara -->
        <a-plane
          position="0 0.004 0"
          width="4.7"
          height="2.85"
          rotation="-90 0 0"
          color="#050a16"
          opacity="0.34"
          transparent="true">
        </a-plane>

        <a-ring
          position="0 0.016 0"
          rotation="-90 0 0"
          radius-inner="0.43"
          radius-outer="0.49"
          color="#4fc3f7"
          opacity="0.42"
          transparent="true">
        </a-ring>
      </a-entity>

      <a-entity id="floorGrid"></a-entity>
      <a-entity id="zones"></a-entity>
      <a-entity id="racks"></a-entity>
      <a-entity id="route"></a-entity>
      <a-entity id="labels"></a-entity>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const rackDefs = [
  {id:'RC05',x:-1.65,z:-1.02,levels:5,bays:6,nps:['99B5492','98A1850'],occ:.82},
  {id:'RC07',x:-0.55,z:-1.02,levels:5,bays:6,nps:['98A1850','100506046'],occ:.92},
  {id:'RC08',x: 0.55,z:-1.02,levels:5,bays:6,nps:['E7137200','70CR'],occ:.55},
  {id:'RC10',x: 1.65,z:-1.02,levels:5,bays:6,nps:['100506046','1110CR'],occ:.78},

  {id:'RC14',x:-1.65,z: 0.58,levels:5,bays:6,nps:['1110CR','98A1850'],occ:.88},
  {id:'RC15',x:-0.55,z: 0.58,levels:5,bays:6,nps:['70CR','99B5492'],occ:.62},
  {id:'RC16',x: 0.55,z: 0.58,levels:5,bays:6,nps:['70CR','E7137200'],occ:.96},
  {id:'RC18',x: 1.65,z: 0.58,levels:5,bays:6,nps:['100506046','D3301'],occ:.45}
];

const inventory = {
  '98A1850':'RC07-3-05',
  '100506046':'RC10-2-04',
  '1110CR':'RC14-4-03',
  '70CR':'RC16-2-06',
  '99B5492':'RC05-1-02',
  'E7137200':'RC08-5-04'
};

const state = {
  scale:0.46,
  rotY:0,
  x:0,
  z:0,
  mode:'normal',
  route:false,
  base:true,
  labels:true,
  detail:true,
  selectedRack:null,
  selectedLocal:null,
  marker:false,
  gesture:null
};

const rackMap = {};
const localMap = {};
let raycaster = null;
let sceneEl = null;
let cameraObj = null;
let selectable = [];

const root = document.getElementById('arRoot');
const racksEl = document.getElementById('racks');
const labelsEl = document.getElementById('labels');
const routeEl = document.getElementById('route');
const zonesEl = document.getElementById('zones');
const gridEl = document.getElementById('floorGrid');
const baseGroup = document.getElementById('baseGroup');
const info = document.getElementById('info');
const miniStatus = document.getElementById('miniStatus');
const controls = document.getElementById('controls');
const showControls = document.getElementById('showControls');
const marker = document.getElementById('marker');

function E(tag, attrs={}){
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
  return el;
}

function setInfo(html){
  info.innerHTML = html;
}

function applyTransform(){
  root.setAttribute('position', `${state.x} 0.025 ${state.z}`);
  root.setAttribute('rotation', `0 ${state.rotY} 0`);
  root.setAttribute('scale', `${state.scale} ${state.scale} ${state.scale}`);
}

function updateMode(){
  Object.values(localMap).forEach(local=>{
    const el = local.el;

    if(state.selectedLocal === local.id){
      el.setAttribute('color','#ffe000');
      el.setAttribute('opacity','1');
      return;
    }

    if(state.mode === 'occupancy'){
      if(local.reserved){
        el.setAttribute('color','#e74c3c');
        el.setAttribute('opacity','.92');
      }else if(local.occupied){
        el.setAttribute('color','#55efc4');
        el.setAttribute('opacity','.82');
      }else{
        el.setAttribute('color','#1b3660');
        el.setAttribute('opacity','.34');
      }
    }else{
      el.setAttribute('color', local.occupied ? '#1e3c6e' : '#0e1e38');
      el.setAttribute('opacity', local.occupied ? '.74' : '.28');
    }
  });

  Object.values(rackMap).forEach(r=>{
    const selected = state.selectedRack === r.id;
    r.parts.forEach(p=>{
      p.setAttribute('color', selected ? '#4fc3f7' : '#5f7284');
      p.setAttribute('opacity', selected ? '.95' : '.70');
    });

    r.labelBox.setAttribute('color', selected ? '#0e3060' : '#08111e');
    r.labelText.setAttribute('color', selected ? '#ffe000' : '#4fc3f7');
  });

  routeEl.setAttribute('visible', state.route ? 'true' : 'false');
  baseGroup.setAttribute('visible', state.base ? 'true' : 'false');
  labelsEl.setAttribute('visible', state.labels ? 'true' : 'false');
  gridEl.setAttribute('visible', state.detail ? 'true' : 'false');

  if(state.selectedLocal){
    const l = localMap[state.selectedLocal];
    setInfo(`<b>Local:</b> ${l.id}<br><b>Rack:</b> ${l.rackId}<br><b>Estado:</b> ${l.occupied?'Ocupado':'Vacío'} ${l.reserved?'· Reservado':''}`);
  }else if(state.selectedRack){
    const r = rackMap[state.selectedRack];
    setInfo(`<b>Rack:</b> ${r.id}<br><b>Locales:</b> ${r.localIds.length}<br><b>NP demo:</b> ${r.def.nps.join(', ')}`);
  }else{
    setInfo(`<b>Estado:</b> ${state.marker?'marcador detectado':'esperando marcador HIRO'}.`);
  }
}

function build(){
  buildGrid();
  buildZones();
  rackDefs.forEach(buildRack);
  buildRoute();
  updateMode();
  applyTransform();
}

function buildGrid(){
  gridEl.innerHTML = '';

  for(let x=-2.25;x<=2.25;x+=0.35){
    gridEl.appendChild(E('a-box',{
      position:`${x} 0.010 0`,
      width:'0.006',
      height:'0.006',
      depth:'2.65',
      color:'#1b3660',
      opacity:'.34',
      transparent:'true'
    }));
  }

  for(let z=-1.25;z<=1.25;z+=0.35){
    gridEl.appendChild(E('a-box',{
      position:`0 0.011 ${z}`,
      width:'4.45',
      height:'0.006',
      depth:'0.006',
      color:'#1b3660',
      opacity:'.34',
      transparent:'true'
    }));
  }

  [-0.35,0.25].forEach(z=>{
    gridEl.appendChild(E('a-box',{
      position:`0 0.018 ${z}`,
      width:'4.05',
      height:'0.012',
      depth:'0.045',
      color:'#f39c12',
      opacity:'.48',
      transparent:'true'
    }));
  });
}

function buildZones(){
  zonesEl.innerHTML = '';

  addZone('RECIBO',-2.02,-1.30,.55,.20,'#55efc4');
  addZone('SURTIDO', 2.02,-1.30,.62,.20,'#f39c12');
  addZone('AUDITORÍA',-2.02,1.10,.66,.20,'#9b59b6');
  addZone('EMBARQUE',2.02,1.10,.68,.20,'#4fc3f7');

  for(let i=0;i<4;i++){
    zonesEl.appendChild(E('a-box',{
      position:`${1.05+i*.32} 0.08 -1.48`,
      width:'.24',
      height:'.13',
      depth:'.12',
      color:'#596b80',
      opacity:'.72',
      transparent:'true'
    }));
    zonesEl.appendChild(E('a-box',{
      position:`${1.05+i*.32} 0.17 -1.56`,
      width:'.22',
      height:'.16',
      depth:'.05',
      color:'#4fc3f7',
      opacity:'.36',
      transparent:'true'
    }));
  }
}

function addZone(label,x,z,w,d,color){
  zonesEl.appendChild(E('a-box',{
    position:`${x} 0.020 ${z}`,
    width:w,
    height:'.016',
    depth:d,
    color,
    opacity:'.46',
    transparent:'true'
  }));

  const text = E('a-text',{
    value:label,
    position:`${x-w/2+.04} .058 ${z}`,
    rotation:'-90 0 0',
    color:'#e0eaff',
    width:'1.8'
  });
  labelsEl.appendChild(text);
}

function buildRack(def){
  const group = E('a-entity',{position:`${def.x} 0 ${def.z}`});
  racksEl.appendChild(group);

  const rackWidth = .78;
  const rackDepth = .22;
  const rackHeight = .74;
  const levelGap = .142;
  const bayWidth = rackWidth / def.bays;
  const parts = [];
  const localIds = [];
  const localEntities = [];

  const hit = E('a-box',{
    position:`0 ${rackHeight/2} 0`,
    width:`${rackWidth+.14}`,
    height:`${rackHeight+.18}`,
    depth:`${rackDepth+.18}`,
    color:'#ffffff',
    opacity:'.001',
    transparent:'true'
  });
  group.appendChild(hit);

  hit.addEventListener('loaded',()=>{
    hit.object3D.userData.meta = {type:'rack', rackId:def.id};
    selectable.push(hit.object3D);
  });

  for(let i=0;i<=def.bays;i++){
    const x = -rackWidth/2 + i*bayWidth;
    [-rackDepth/2,rackDepth/2].forEach(z=>{
      const post = E('a-box',{
        position:`${x} ${rackHeight/2} ${z}`,
        width:'.018',
        height:rackHeight,
        depth:'.018',
        color:'#5f7284',
        opacity:'.72',
        transparent:'true'
      });
      group.appendChild(post);
      parts.push(post);
    });
  }

  for(let lv=0;lv<=def.levels;lv++){
    const y = .05 + lv*levelGap;
    [-rackDepth/2,rackDepth/2].forEach(z=>{
      const beam = E('a-box',{
        position:`0 ${y} ${z}`,
        width:rackWidth,
        height:'.018',
        depth:'.025',
        color:'#5f7284',
        opacity:'.72',
        transparent:'true'
      });
      group.appendChild(beam);
      parts.push(beam);
    });
  }

  for(let lv=1;lv<=def.levels;lv++){
    for(let bay=1;bay<=def.bays;bay++){
      const x = -rackWidth/2 + (bay-.5)*bayWidth;
      const y = .05 + (lv-.55)*levelGap;
      const localId = `${def.id}-${lv}-${String(bay).padStart(2,'0')}`;
      const occupied = ((lv+bay+def.id.charCodeAt(3))%3)!==0;
      const reserved = ((lv+bay+def.id.charCodeAt(2))%11)===0;

      const loc = E('a-box',{
        position:`${x} ${y} -.005`,
        width:`${bayWidth-.02}`,
        height:'.078',
        depth:`${rackDepth-.05}`,
        color:occupied ? '#1e3c6e' : '#0e1e38',
        opacity:occupied ? '.74' : '.28',
        transparent:'true'
      });

      group.appendChild(loc);
      localIds.push(localId);
      localEntities.push(loc);

      loc.addEventListener('loaded',()=>{
        loc.object3D.userData.meta = {type:'local', rackId:def.id, localId};
        selectable.push(loc.object3D);
      });

      localMap[localId] = {id:localId,rackId:def.id,occupied,reserved,el:loc};
    }
  }

  const labelBox = E('a-plane',{
    position:`0 .84 -.15`,
    width:'.40',
    height:'.11',
    color:'#08111e',
    opacity:'.86',
    transparent:'true'
  });
  const labelText = E('a-text',{
    value:def.id,
    position:'0 0 .01',
    align:'center',
    color:'#4fc3f7',
    width:'1.3'
  });
  labelBox.appendChild(labelText);
  group.appendChild(labelBox);

  rackMap[def.id] = {id:def.id,def,group,parts,localIds,localEntities,labelBox,labelText};
}

function buildRoute(){
  routeEl.innerHTML = '';

  const points = [
    [-2.02,1.10],
    [-1.65,.25],
    [-.55,.25],
    [-.55,-1.02],
    [.55,-1.02],
    [1.65,-1.02],
    [2.02,-1.30]
  ];

  for(let i=0;i<points.length-1;i++){
    const [x1,z1] = points[i];
    const [x2,z2] = points[i+1];
    const dx = x2-x1;
    const dz = z2-z1;
    const len = Math.sqrt(dx*dx+dz*dz);
    const rot = Math.atan2(dx,dz)*180/Math.PI;

    routeEl.appendChild(E('a-box',{
      position:`${(x1+x2)/2} .038 ${(z1+z2)/2}`,
      width:'.055',
      height:'.025',
      depth:len,
      rotation:`0 ${rot} 0`,
      color:'#f39c12',
      opacity:'.66',
      transparent:'true'
    }));
  }
}

function selectRack(id){
  state.selectedRack = id;
  state.selectedLocal = null;
  updateMode();
}

function selectLocal(id){
  const local = localMap[id];
  if(!local) return;
  state.selectedRack = local.rackId;
  state.selectedLocal = id;
  updateMode();
}

function clearSelection(){
  state.selectedRack = null;
  state.selectedLocal = null;
  updateMode();
}

function normalize(v){
  return String(v||'').trim().toUpperCase().replace(/\s+/g,'').replace(/[–—]/g,'-');
}

function searchTarget(){
  const q = normalize(document.getElementById('searchInput').value);

  if(!q){
    setInfo('<b>Buscar:</b> escribe RC07, RC07-3-05 o un NP demo.');
    return;
  }

  if(rackMap[q]){
    selectRack(q);
    return;
  }

  if(localMap[q]){
    selectLocal(q);
    return;
  }

  if(inventory[q]){
    selectLocal(inventory[q]);
    return;
  }

  setInfo(`<b>No encontré:</b> ${q}<br>Prueba: RC07, RC07-3-05, 98A1850, 100506046.`);
}

function setMode(m){
  state.mode = m;
  updateMode();
}

function toggleRoute(){
  state.route = !state.route;
  updateMode();
}

function toggleBase(){
  state.base = !state.base;
  updateMode();
}

function toggleLabels(){
  state.labels = !state.labels;
  updateMode();
}

function toggleDetail(){
  state.detail = !state.detail;
  updateMode();
}

function scaleModel(mult){
  state.scale = Math.max(.24, Math.min(1.20, state.scale*mult));
  applyTransform();
}

function rotateModel(deg){
  state.rotY += deg;
  applyTransform();
}

function moveModel(dx,dz){
  state.x += dx;
  state.z += dz;
  applyTransform();
}

function resetView(){
  state.scale = .46;
  state.rotY = 0;
  state.x = 0;
  state.z = 0;
  state.mode = 'normal';
  state.route = false;
  state.base = true;
  state.labels = true;
  state.detail = true;
  clearSelection();
  applyTransform();
  updateMode();
}

function showPanel(){
  controls.classList.add('open');
  showControls.classList.add('hidden');
}

function hidePanel(){
  controls.classList.remove('open');
  showControls.classList.remove('hidden');
}

showControls.addEventListener('click', showPanel);
document.getElementById('searchInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') searchTarget();
});

function screenToNDC(x,y){
  const canvas = sceneEl.canvas;
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((x-rect.left)/rect.width)*2-1,
    y: -((y-rect.top)/rect.height)*2+1
  };
}

function findMeta(obj){
  let cur = obj;
  while(cur){
    if(cur.userData && cur.userData.meta) return cur.userData.meta;
    cur = cur.parent;
  }
  return null;
}

function pick(x,y){
  if(!sceneEl || !cameraObj || !raycaster || !selectable.length) return false;

  const ndc = screenToNDC(x,y);
  raycaster.setFromCamera(ndc, cameraObj);

  const hits = raycaster.intersectObjects(selectable,true);
  for(const h of hits){
    const meta = findMeta(h.object);
    if(!meta) continue;

    if(meta.type === 'local'){
      selectLocal(meta.localId);
      return true;
    }

    if(meta.type === 'rack'){
      selectRack(meta.rackId);
      return true;
    }
  }
  return false;
}

function distance(t1,t2){
  const dx = t1.clientX-t2.clientX;
  const dy = t1.clientY-t2.clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

function midpoint(t1,t2){
  return {
    x:(t1.clientX+t2.clientX)/2,
    y:(t1.clientY+t2.clientY)/2
  };
}

let sceneEl;
let cameraObj;

function bindGestures(){
  sceneEl.addEventListener('loaded',()=>{
    cameraObj = sceneEl.camera;
    raycaster = new THREE.Raycaster();

    const canvas = sceneEl.canvas;
    canvas.style.touchAction = 'none';

    canvas.addEventListener('touchstart',e=>{
      if(!state.marker) return;

      if(e.touches.length===1){
        const t = e.touches[0];
        state.gesture = {
          type:'one',
          sx:t.clientX,
          sy:t.clientY,
          rot:state.rotY,
          moved:false
        };
      }

      if(e.touches.length===2){
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const mid = midpoint(t1,t2);
        state.gesture = {
          type:'two',
          dist:distance(t1,t2),
          scale:state.scale,
          mx:mid.x,
          my:mid.y,
          x:state.x,
          z:state.z
        };
      }
    },{passive:true});

    canvas.addEventListener('touchmove',e=>{
      if(!state.marker || !state.gesture) return;

      if(e.touches.length===1 && state.gesture.type==='one'){
        const t = e.touches[0];
        const dx = t.clientX-state.gesture.sx;
        const dy = t.clientY-state.gesture.sy;

        if(Math.abs(dx)>4 || Math.abs(dy)>4) state.gesture.moved = true;

        state.rotY = state.gesture.rot + dx*.20;
        applyTransform();
      }

      if(e.touches.length===2 && state.gesture.type==='two'){
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const mid = midpoint(t1,t2);
        const ratio = distance(t1,t2)/Math.max(1,state.gesture.dist);

        state.scale = Math.max(.24,Math.min(1.20,state.gesture.scale*ratio));
        state.x = state.gesture.x + (mid.x-state.gesture.mx)*.0015;
        state.z = state.gesture.z + (mid.y-state.gesture.my)*.0015;
        applyTransform();
      }
    },{passive:true});

    canvas.addEventListener('touchend',e=>{
      if(!state.marker || !state.gesture) return;

      if(state.gesture.type==='one' && !state.gesture.moved){
        const t = e.changedTouches[0];
        if(t) pick(t.clientX,t.clientY);
      }

      state.gesture = null;
    },{passive:true});

    canvas.addEventListener('click',e=>{
      if(state.marker) pick(e.clientX,e.clientY);
    });
  });
}

function init(){
  sceneEl = document.querySelector('a-scene');
  build();
  bindGestures();

  marker.addEventListener('markerFound',()=>{
    state.marker = true;
    miniStatus.classList.add('ok');
    updateMode();
  });

  marker.addEventListener('markerLost',()=>{
    state.marker = false;
    miniStatus.classList.remove('ok');
    updateMode();
  });

  hidePanel();
}

init();
</script>

</body>
</html>

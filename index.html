<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MiniWMS AR · V6 Visual Realista</title>

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  background:#000;
  font-family:Segoe UI,Arial,sans-serif;
}

#top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  padding:12px;
  background:linear-gradient(180deg,rgba(5,10,22,.94),rgba(5,10,22,.68));
  color:#4fc3f7;
  font-weight:800;
  font-size:15px;
  border-bottom:1px solid rgba(79,195,247,.35);
  backdrop-filter:blur(10px);
}

#status{
  position:fixed;
  top:55px;
  left:50%;
  transform:translateX(-50%);
  z-index:60;
  padding:8px 14px;
  border-radius:20px;
  background:rgba(90,0,0,.88);
  color:#ffb3b3;
  border:1px solid #e74c3c;
  font-size:13px;
  text-align:center;
  min-width:230px;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

#status.ok{
  background:rgba(0,70,35,.88);
  color:#55efc4;
  border-color:#2ecc71;
}

#controls{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:70;
  background:rgba(5,10,22,.90);
  border:1px solid #1b3660;
  border-radius:16px;
  padding:12px;
  color:white;
  backdrop-filter:blur(10px);
  box-shadow:0 12px 35px rgba(0,0,0,.45);
}

#controls.hidden{
  display:none;
}

#showControls{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:80;
  display:none;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid #4fc3f7;
  background:rgba(5,10,22,.92);
  color:#4fc3f7;
  font-size:14px;
  font-weight:800;
  box-shadow:0 8px 25px rgba(0,0,0,.45);
}

#showControls.show{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:8px;
}

button{
  width:100%;
  padding:10px 8px;
  border-radius:11px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.92);
  color:#a8d4ff;
  font-size:13px;
  font-weight:700;
}

button:active{
  transform:scale(.97);
}

button.primary{
  border-color:#4fc3f7;
  color:#4fc3f7;
}

button.green{
  border-color:#2ecc71;
  color:#55efc4;
}

button.orange{
  border-color:#f39c12;
  color:#f5b041;
}

button.purple{
  border-color:#9b59b6;
  color:#d7b4ea;
}

button.red{
  border-color:#e74c3c;
  color:#ff9999;
}

.searchRow{
  display:flex;
  gap:8px;
  margin-top:8px;
}

input{
  flex:1;
  min-width:0;
  padding:10px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.9);
  color:#e0eaff;
  font-size:13px;
  outline:none;
}

input:focus{
  border-color:#4fc3f7;
}

#info{
  margin-top:9px;
  padding:9px 10px;
  border:1px solid rgba(79,195,247,.22);
  border-radius:12px;
  background:rgba(12,25,55,.70);
  color:#c7dcf5;
  font-size:12px;
  line-height:1.55;
}

#info b{
  color:#4fc3f7;
}

@media(max-width:420px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .grid.cal{
    grid-template-columns:repeat(4,1fr);
  }

  button{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="top">🏭 MiniWMS AR · V6 Visual Realista</div>
<div id="status">Buscando marcador HIRO...</div>

<div id="controls">
  <div class="grid">
    <button class="primary" onclick="scaleWarehouse(1.15)">＋ Acercar</button>
    <button class="primary" onclick="scaleWarehouse(0.87)">－ Alejar</button>
    <button onclick="rotateWarehouse(-15)">↶ Girar</button>
    <button onclick="rotateWarehouse(15)">↷ Girar</button>

    <button class="green" onclick="toggleWarehouse()">Almacén</button>
    <button class="orange" onclick="toggleHeatmap()">Ocupación</button>
    <button class="purple" onclick="highlightRoute()">Ruta Pick</button>
    <button onclick="resetWarehouse()">Reset</button>

    <button class="primary" onclick="toggleStyleMode()">Modo Visual</button>
    <button class="orange" onclick="toggleAnchor()">Base AR</button>
    <button class="red" onclick="clearHighlight()">Limpiar</button>
    <button onclick="hideControls()">Ocultar</button>
  </div>

  <div class="grid cal">
    <button class="purple" onclick="moveWarehouse(0,-0.08)">↑</button>
    <button class="purple" onclick="moveWarehouse(-0.08,0)">←</button>
    <button class="purple" onclick="moveWarehouse(0.08,0)">→</button>
    <button class="purple" onclick="moveWarehouse(0,0.08)">↓</button>
  </div>

  <div class="searchRow">
    <input id="searchInput" placeholder="Buscar rack o NP demo. Ej: RC07, 98A1850" onkeydown="if(event.key==='Enter')searchRack()">
    <button class="primary" onclick="searchRack()">Buscar</button>
  </div>

  <div id="info">
    <b>Estado:</b> esperando marcador. Al detectarlo, aparecerá una maqueta más realista del almacén.
  </div>
</div>

<button id="showControls" onclick="showControls()">▲ Controles</button>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; antialias:true; alpha:true;"
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; trackingMethod:best;">

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">

    <a-entity id="anchorGroup" visible="true">
      <a-box
        id="basePlate"
        position="0 0.012 0"
        width="1.30"
        height="0.018"
        depth="1.30"
        color="#00d9ff"
        opacity="0.22"
        transparent="true">
      </a-box>

      <a-ring
        position="0 0.028 0"
        rotation="-90 0 0"
        radius-inner="0.50"
        radius-outer="0.56"
        color="#4fc3f7"
        opacity="0.70"
        transparent="true">
      </a-ring>

      <a-box
        position="0 0.035 0"
        width="1.05"
        height="0.018"
        depth="0.025"
        color="#ffe000"
        opacity="0.65"
        transparent="true">
      </a-box>

      <a-box
        position="0 0.036 0"
        width="0.025"
        height="0.018"
        depth="1.05"
        color="#ffe000"
        opacity="0.65"
        transparent="true">
      </a-box>
    </a-entity>

    <a-entity
      id="warehouse"
      position="0 0.045 0"
      rotation="0 0 0"
      scale="0.060 0.060 0.060"
      visible="true">
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const rackInfo = {
  RC01:{x:-7.5,z:-4.2,levels:4,bays:6,occ:18,cap:32,np:["98A1850","100506046"]},
  RC02:{x:-5.0,z:-4.2,levels:4,bays:6,occ:24,cap:32,np:["99B5492","E7137200"]},
  RC03:{x:-2.5,z:-4.2,levels:4,bays:6,occ:10,cap:32,np:["A1840","B7721"]},
  RC04:{x:0.0,z:-4.2,levels:4,bays:6,occ:26,cap:32,np:["98A1850","C5520"]},
  RC05:{x:2.5,z:-4.2,levels:4,bays:6,occ:31,cap:32,np:["100506046","D3301"]},
  RC06:{x:5.0,z:-4.2,levels:4,bays:6,occ:14,cap:32,np:["F9010","99B5492"]},

  RC07:{x:-7.5,z:0,levels:5,bays:8,occ:35,cap:50,np:["100506046","98A1850"]},
  RC08:{x:-5.0,z:0,levels:5,bays:8,occ:22,cap:50,np:["G1180","H7750"]},
  RC09:{x:-2.5,z:0,levels:5,bays:8,occ:47,cap:50,np:["E7137200","C5520"]},
  RC10:{x:0.0,z:0,levels:5,bays:8,occ:40,cap:50,np:["100506046","99B5492"]},
  RC11:{x:2.5,z:0,levels:5,bays:8,occ:12,cap:50,np:["J4500","K8810"]},
  RC12:{x:5.0,z:0,levels:5,bays:8,occ:28,cap:50,np:["M3300","N9900"]},

  RC13:{x:-7.5,z:4.2,levels:4,bays:6,occ:8,cap:32,np:["P1100","Q5510"]},
  RC14:{x:-5.0,z:4.2,levels:4,bays:6,occ:30,cap:32,np:["100506046","98A1850"]},
  RC15:{x:-2.5,z:4.2,levels:4,bays:6,occ:19,cap:32,np:["R4400","S5521"]},
  RC16:{x:0.0,z:4.2,levels:4,bays:6,occ:32,cap:32,np:["99B5492","E7137200"]},
  RC17:{x:2.5,z:4.2,levels:4,bays:6,occ:5,cap:32,np:["T1010","U1120"]},
  RC18:{x:5.0,z:4.2,levels:4,bays:6,occ:16,cap:32,np:["V2001","W8871"]}
};

let scale = 0.060;
let rotationY = 0;
let offsetX = 0;
let offsetZ = 0;
let heatmap = false;
let warehouseVisible = true;
let anchorVisible = true;
let styleMode = "realista";

function createEntity(tag, attrs){
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([key,value]) => {
    el.setAttribute(key,value);
  });
  return el;
}

function initWarehouse(){
  const warehouse = document.getElementById("warehouse");
  warehouse.innerHTML = "";

  createFloor(warehouse);
  createZones(warehouse);
  createAisles(warehouse);
  createDocks(warehouse);
  createColumns(warehouse);

  Object.keys(rackInfo).forEach(id => {
    createRack(warehouse, id, rackInfo[id]);
  });

  const title = createEntity("a-text", {
    value:"MiniWMS AR · CEVA Layout",
    position:"-8.6 0.20 -6.7",
    rotation:"-90 0 0",
    color:"#4fc3f7",
    width:"5.2"
  });
  warehouse.appendChild(title);
}

function createFloor(parent){
  const floor = createEntity("a-box", {
    position:"-1.25 0 0",
    width:"18.6",
    height:"0.08",
    depth:"13.4",
    color: styleMode === "holograma" ? "#061b35" : "#101a2d",
    opacity: styleMode === "holograma" ? "0.55" : "0.92",
    transparent:"true"
  });
  parent.appendChild(floor);

  for(let x=-10; x<=8; x+=1){
    parent.appendChild(createEntity("a-box", {
      position:`${x} 0.045 0`,
      width:"0.018",
      height:"0.025",
      depth:"12.8",
      color:"#1b3660",
      opacity: styleMode === "holograma" ? "0.45" : "0.22",
      transparent:"true"
    }));
  }

  for(let z=-6; z<=6; z+=1){
    parent.appendChild(createEntity("a-box", {
      position:`-1.25 0.046 ${z}`,
      width:"18.2",
      height:"0.025",
      depth:"0.018",
      color:"#1b3660",
      opacity: styleMode === "holograma" ? "0.45" : "0.22",
      transparent:"true"
    }));
  }
}

function createZones(parent){
  addZone(parent,"RECIBO",-8.0,-6.0,3.2,0.9,"#16a085");
  addZone(parent,"SURTIDO",4.6,-6.0,4.2,0.9,"#e67e22");
  addZone(parent,"AUDITORIA",-8.0,6.0,3.5,0.9,"#9b59b6");
  addZone(parent,"EMBARQUE",4.6,6.0,4.2,0.9,"#3498db");
}

function addZone(parent,label,x,z,w,d,color){
  parent.appendChild(createEntity("a-box", {
    position:`${x} 0.075 ${z}`,
    width:w,
    height:"0.07",
    depth:d,
    color:color,
    opacity: styleMode === "holograma" ? "0.32" : "0.62",
    transparent:"true"
  }));

  parent.appendChild(createEntity("a-text", {
    value:label,
    position:`${x - w/2 + 0.18} 0.18 ${z}`,
    rotation:"-90 0 0",
    color:"#ffffff",
    width:"4"
  }));
}

function createAisles(parent){
  [-2.10,2.10].forEach(z => {
    parent.appendChild(createEntity("a-box", {
      position:`-1.25 0.09 ${z}`,
      width:"18.0",
      height:"0.05",
      depth:"0.42",
      color:"#f39c12",
      opacity: styleMode === "holograma" ? "0.35" : "0.25",
      transparent:"true"
    }));
  });

  [-9.3,7.0].forEach(x => {
    parent.appendChild(createEntity("a-box", {
      position:`${x} 0.092 0`,
      width:"0.36",
      height:"0.05",
      depth:"12.6",
      color:"#4fc3f7",
      opacity:"0.18",
      transparent:"true"
    }));
  });
}

function createDocks(parent){
  for(let i=0;i<4;i++){
    const x = 2.8 + i*1.15;

    parent.appendChild(createEntity("a-box", {
      position:`${x} 0.25 -6.65`,
      width:"0.85",
      height:"0.42",
      depth:"0.25",
      color:"#34495e",
      opacity:"0.96"
    }));

    parent.appendChild(createEntity("a-box", {
      position:`${x} 0.55 -6.85`,
      width:"0.75",
      height:"0.48",
      depth:"0.16",
      color:"#4fc3f7",
      opacity:"0.55",
      transparent:"true"
    }));
  }
}

function createColumns(parent){
  const columns = [
    [-8.8,-5.0],[-3.5,-5.0],[2.0,-5.0],[6.5,-5.0],
    [-8.8,1.4],[-3.5,1.4],[2.0,1.4],[6.5,1.4],
    [-8.8,5.0],[-3.5,5.0],[2.0,5.0],[6.5,5.0]
  ];

  columns.forEach(([x,z]) => {
    parent.appendChild(createEntity("a-cylinder", {
      position:`${x} 0.48 ${z}`,
      radius:"0.09",
      height:"0.95",
      color:"#566573",
      opacity:"0.90"
    }));
  });
}

function createRack(parent,id,info){
  const rack = createEntity("a-entity", {
    id:id,
    class:"rack",
    position:`${info.x} 0 ${info.z}`
  });

  const ratio = info.occ / info.cap;
  const rackLength = info.bays * 0.26;
  const rackHeight = info.levels * 0.28;
  const rackDepth = 0.58;

  const hit = createEntity("a-box", {
    position:`0 ${rackHeight/2} 0`,
    width:String(rackLength + 0.25),
    height:String(rackHeight + 0.25),
    depth:String(rackDepth + 0.28),
    color:"#ffffff",
    opacity:"0.001",
    transparent:"true"
  });
  rack.appendChild(hit);

  for(let i=0;i<=info.bays;i++){
    const x = -rackLength/2 + i*(rackLength/info.bays);

    [-rackDepth/2,rackDepth/2].forEach(z => {
      rack.appendChild(createEntity("a-box", {
        position:`${x} ${rackHeight/2} ${z}`,
        width:"0.035",
        height:String(rackHeight),
        depth:"0.035",
        color: styleMode === "holograma" ? "#4fc3f7" : "#6f8cad",
        opacity: styleMode === "holograma" ? "0.72" : "1",
        transparent: styleMode === "holograma" ? "true" : "false"
      }));
    });
  }

  for(let level=0;level<=info.levels;level++){
    const y = level * 0.28;

    [-rackDepth/2,rackDepth/2].forEach(z => {
      rack.appendChild(createEntity("a-box", {
        position:`0 ${y} ${z}`,
        width:String(rackLength + 0.08),
        height:"0.030",
        depth:"0.045",
        color: styleMode === "holograma" ? "#4fc3f7" : "#4a6382",
        opacity: styleMode === "holograma" ? "0.70" : "1",
        transparent: styleMode === "holograma" ? "true" : "false"
      }));
    });
  }

  let placed = 0;
  const palletColor = getRackColor(ratio);

  for(let level=0;level<info.levels;level++){
    for(let bay=0;bay<info.bays;bay++){
      if(placed >= info.occ) break;

      const x = -rackLength/2 + (bay + 0.5) * (rackLength/info.bays);
      const y = 0.10 + level * 0.28;
      const z = bay % 2 === 0 ? -0.15 : 0.15;

      rack.appendChild(createEntity("a-box", {
        class:"pallet",
        position:`${x} ${y} ${z}`,
        width:"0.18",
        height:"0.13",
        depth:"0.24",
        color:palletColor,
        opacity: styleMode === "holograma" ? "0.58" : "0.95",
        transparent: styleMode === "holograma" ? "true" : "false"
      }));

      placed++;
    }
  }

  rack.appendChild(createEntity("a-text", {
    value:id,
    position:`${-rackLength/2} ${rackHeight + 0.10} ${-rackDepth/2 - 0.12}`,
    rotation:"-65 0 0",
    color:"#ffffff",
    width:"2.2"
  }));

  rack.addEventListener("click", () => selectRack(id));
  hit.addEventListener("click", () => selectRack(id));

  parent.appendChild(rack);
}

function getRackColor(ratio){
  if(!heatmap){
    return styleMode === "holograma" ? "#00d9ff" : "#2ecc71";
  }

  if(ratio >= 0.90) return "#e74c3c";
  if(ratio >= 0.70) return "#f39c12";
  return "#2ecc71";
}

function rebuildWarehouse(){
  initWarehouse();
}

function scaleWarehouse(mult){
  scale = Math.max(0.020, Math.min(0.16, scale * mult));
  applyTransform();
  updateInfo(`Escala: <b>${scale.toFixed(3)}</b>`);
}

function rotateWarehouse(deg){
  rotationY += deg;
  applyTransform();
}

function moveWarehouse(dx,dz){
  offsetX += dx;
  offsetZ += dz;
  applyTransform();

  updateInfo(`Offset:<br>X: <b>${offsetX.toFixed(2)}</b> · Z: <b>${offsetZ.toFixed(2)}</b>`);
}

function applyTransform(){
  const warehouse = document.getElementById("warehouse");
  warehouse.setAttribute("scale",`${scale} ${scale} ${scale}`);
  warehouse.setAttribute("rotation",`0 ${rotationY} 0`);
  warehouse.setAttribute("position",`${offsetX} 0.045 ${offsetZ}`);
}

function resetWarehouse(){
  scale = 0.060;
  rotationY = 0;
  offsetX = 0;
  offsetZ = 0;
  warehouseVisible = true;

  const warehouse = document.getElementById("warehouse");
  warehouse.setAttribute("visible","true");

  applyTransform();
  clearHighlight();

  updateInfo("<b>Vista reiniciada.</b><br>Maqueta centrada sobre el marcador HIRO.");
}

function toggleWarehouse(){
  warehouseVisible = !warehouseVisible;
  document.getElementById("warehouse").setAttribute("visible",warehouseVisible ? "true" : "false");

  updateInfo(warehouseVisible ? "<b>Almacén visible.</b>" : "<b>Almacén oculto.</b>");
}

function toggleAnchor(){
  anchorVisible = !anchorVisible;
  document.getElementById("anchorGroup").setAttribute("visible",anchorVisible ? "true" : "false");

  updateInfo(anchorVisible ? "<b>Base AR visible.</b>" : "<b>Base AR oculta.</b>");
}

function toggleHeatmap(){
  heatmap = !heatmap;
  rebuildWarehouse();

  updateInfo(
    heatmap
      ? "<b>Ocupación activa.</b><br>Verde bajo, naranja alto, rojo crítico."
      : "<b>Ocupación apagada.</b><br>Color visual simplificado."
  );
}

function toggleStyleMode(){
  styleMode = styleMode === "realista" ? "holograma" : "realista";
  rebuildWarehouse();

  updateInfo(
    styleMode === "holograma"
      ? "<b>Modo holograma activo.</b><br>Más transparencia y brillo azul."
      : "<b>Modo realista activo.</b><br>Racks más sólidos y visual operativo."
  );
}

function selectRack(id){
  clearHighlight(false);

  const rack = document.getElementById(id);
  const info = rackInfo[id];

  rack.querySelectorAll("a-box").forEach(box => {
    box.setAttribute("emissive","#ffe000");
    box.setAttribute("emissiveIntensity","0.55");
  });

  updateInfo(
    `<b>${id}</b><br>` +
    `Ocupación: <b>${info.occ}/${info.cap}</b> (${Math.round(info.occ/info.cap*100)}%).<br>` +
    `NP demo: ${info.np.join(", ")}`
  );
}

function clearHighlight(showMsg=true){
  document.querySelectorAll(".rack a-box").forEach(box => {
    box.removeAttribute("emissive");
    box.removeAttribute("emissiveIntensity");
  });

  if(showMsg){
    updateInfo("<b>Resaltado limpio.</b><br>Puedes seleccionar un rack o buscar un NP.");
  }
}

function highlightRoute(){
  clearHighlight(false);

  ["RC07","RC10","RC14","RC16"].forEach(id => {
    const rack = document.getElementById(id);

    rack.querySelectorAll("a-box").forEach(box => {
      box.setAttribute("emissive","#ffe000");
      box.setAttribute("emissiveIntensity","0.60");
    });
  });

  updateInfo("<b>Ruta picking demo:</b><br>RC07 → RC10 → RC14 → RC16");
}

function searchRack(){
  const q = document.getElementById("searchInput").value.trim().toUpperCase();

  if(!q){
    updateInfo("Escribe un rack o NP demo.");
    return;
  }

  const hits = Object.keys(rackInfo).filter(id => {
    const info = rackInfo[id];
    return id.includes(q) || info.np.some(np => np.includes(q));
  });

  if(!hits.length){
    clearHighlight(false);
    updateInfo(`No encontré: <b>${q}</b>`);
    return;
  }

  clearHighlight(false);

  hits.forEach(id => {
    const rack = document.getElementById(id);

    rack.querySelectorAll("a-box").forEach(box => {
      box.setAttribute("emissive","#ffe000");
      box.setAttribute("emissiveIntensity","0.60");
    });
  });

  updateInfo(`Resultado para <b>${q}</b>:<br>${hits.join(", ")}`);
}

function updateInfo(html){
  document.getElementById("info").innerHTML = html;
}

function hideControls(){
  document.getElementById("controls").classList.add("hidden");
  document.getElementById("showControls").classList.add("show");
}

function showControls(){
  document.getElementById("controls").classList.remove("hidden");
  document.getElementById("showControls").classList.remove("show");
}

window.addEventListener("load", () => {
  initWarehouse();

  const marker = document.getElementById("hiroMarker");
  const status = document.getElementById("status");

  marker.addEventListener("markerFound", () => {
    status.textContent = "Marcador detectado · MiniWMS AR activo";
    status.classList.add("ok");

    updateInfo(
      "<b>Marcador detectado.</b><br>" +
      "V6 visual activa. Ya estamos sobre una base más realista del almacén."
    );
  });

  marker.addEventListener("markerLost", () => {
    status.textContent = "Buscando marcador HIRO...";
    status.classList.remove("ok");
  });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MiniWMS AR · V8.7 Realismo Operativo</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  overflow:hidden;
  background:#02040a;
  font-family:'Segoe UI',Arial,sans-serif;
  color:#e0eaff;
}

#topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:90;
  min-height:38px;
  padding:6px 10px;
  background:linear-gradient(180deg,rgba(5,10,22,.90),rgba(5,10,22,.50));
  border-bottom:1px solid rgba(79,195,247,.22);
  backdrop-filter:blur(8px);
  pointer-events:none;
}

#topbar h1{
  font-size:13px;
  color:#4fc3f7;
  font-weight:800;
  letter-spacing:.3px;
  line-height:1.1;
}

#topbar p{display:none}

#status{
  position:fixed;
  top:46px;
  left:50%;
  transform:translateX(-50%);
  z-index:95;
  min-width:170px;
  text-align:center;
  padding:5px 12px;
  border-radius:18px;
  background:rgba(80,15,15,.82);
  border:1px solid #e74c3c;
  color:#ffb3b3;
  font-size:11px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
  pointer-events:none;
}

#status.ok{
  background:rgba(7,88,48,.84);
  border-color:#27ae60;
  color:#55efc4;
}

#controls{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  z-index:100;
  padding:10px;
  border-radius:16px;
  background:rgba(5,10,22,.90);
  border:1px solid #1b3660;
  box-shadow:0 12px 30px rgba(0,0,0,.48);
  backdrop-filter:blur(10px);
  max-height:64vh;
  overflow-y:auto;
  touch-action:auto;
}

#controls.hidden{display:none}

#showControls{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:110;
  display:none;
  padding:9px 18px;
  border-radius:30px;
  border:1px solid #4fc3f7;
  background:rgba(5,10,22,.88);
  color:#4fc3f7;
  font-size:13px;
  font-weight:800;
  box-shadow:0 8px 22px rgba(0,0,0,.42);
  touch-action:auto;
}

#showControls.show{display:block}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:8px;
}

.mini-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:8px;
}

button{
  width:100%;
  padding:10px 7px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.68);
  color:#a8d4ff;
  font-size:12px;
  font-weight:700;
}

button:active{transform:scale(.98)}
button.primary{border-color:#4fc3f7;color:#4fc3f7}
button.green{border-color:#27ae60;color:#55efc4}
button.orange{border-color:#e67e22;color:#f39c12}
button.purple{border-color:#9b59b6;color:#d7b4ea}
button.red{border-color:#e74c3c;color:#ff9999}
button.yellow{border-color:#f1c40f;color:#ffe066}

.searchRow{
  display:flex;
  gap:8px;
  margin-top:6px;
  align-items:center;
}

.searchRow input{
  flex:1 1 auto;
  width:100%;
  min-width:0;
  padding:10px 9px;
  border-radius:10px;
  border:1px solid #1b3660;
  background:rgba(18,38,75,.58);
  color:#e0eaff;
  font-size:12px;
  outline:none;
  direction:ltr;
  unicode-bidi:plaintext;
  text-align:left;
  text-transform:uppercase;
}

.searchRow input:focus{border-color:#4fc3f7}

.searchRow button{
  flex:0 0 88px;
  width:88px;
  min-width:88px;
}

#info{
  margin-top:8px;
  padding:8px 10px;
  border-radius:12px;
  border:1px solid rgba(79,195,247,.20);
  background:rgba(12,25,55,.58);
  color:#c7dcf5;
  font-size:11.5px;
  line-height:1.45;
}

#info b{color:#4fc3f7}

#hint{
  margin-top:6px;
  color:#7fb3e0;
  font-size:9.5px;
  line-height:1.4;
}

@media(max-width:420px){
  .mini-grid button{
    padding:9px 4px;
    font-size:11.5px;
  }
}
</style>
</head>

<body>

<div id="topbar">
  <h1>🏭 MiniWMS AR · V8.7</h1>
  <p>Vista AR tipo maqueta operativa</p>
</div>

<div id="status">Buscando HIRO...</div>

<div id="controls">
  <div class="grid">
    <button class="primary" onclick="scaleWarehouse(1.12)">+ Acercar</button>
    <button class="primary" onclick="scaleWarehouse(0.88)">− Alejar</button>

    <button onclick="rotateWarehouse(-15)">↶ Girar</button>
    <button onclick="rotateWarehouse(15)">↷ Girar</button>

    <button class="green" onclick="toggleWarehouse()">Almacén</button>
    <button class="orange" onclick="toggleHeatmap()">Ocupación</button>

    <button class="purple" onclick="toggleRoute()">Ruta Pick</button>
    <button onclick="resetWarehouse()">Reset</button>

    <button class="primary" onclick="toggleStyleMode()">Visual</button>
    <button class="orange" onclick="toggleAnchor()">Base AR</button>

    <button class="yellow" onclick="centerWarehouse()">Centrar</button>
    <button class="yellow" onclick="comfortableView()">Vista cómoda</button>

    <button class="green" onclick="toggleSpecialRacks()">Racks especiales</button>
    <button class="purple" onclick="toggleDetail()">Detalle</button>

    <button class="red" onclick="clearHighlight()">Limpiar</button>
    <button class="primary" onclick="operationalView()">Vista operativa</button>
  </div>

  <div class="mini-grid">
    <button class="purple" onclick="moveWarehouse(0,-0.08)">↑</button>
    <button class="purple" onclick="moveWarehouse(-0.08,0)">←</button>
    <button class="purple" onclick="moveWarehouse(0.08,0)">→</button>
    <button class="purple" onclick="moveWarehouse(0,0.08)">↓</button>
  </div>

  <div class="searchRow">
    <input id="searchInput" placeholder="Buscar: RC07, RC07-3-05, 98A1850" onkeydown="if(event.key==='Enter')searchTarget()">
    <button class="primary" onclick="searchTarget()">Buscar</button>
  </div>

  <div id="info">
    <b>Estado:</b> esperando marcador. Al detectarlo, se mostrará el layout AR tipo MiniWMS.
  </div>

  <div id="hint">
    Racks especiales: <b>RC05, RC10, RC14, RC16</b>.<br>
    Con controles ocultos: 1 dedo gira. 2 dedos acercan o mueven. Toque corto intenta seleccionar.
  </div>

  <div style="margin-top:8px">
    <button onclick="hideControls()">Ocultar controles</button>
  </div>
</div>

<button id="showControls" onclick="showControls()">▲ Controles</button>

<a-scene
  id="scene"
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; antialias:true; alpha:true;"
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; trackingMethod:best;">

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">

    <a-entity id="anchorGroup" visible="true">
      <a-box position="0 0.010 0" width="1.34" height="0.016" depth="1.34" color="#050a16" opacity="0.12" transparent="true"></a-box>
      <a-ring position="0 0.026 0" rotation="-90 0 0" radius-inner="0.48" radius-outer="0.56" color="#4fc3f7" opacity="0.48" transparent="true"></a-ring>
      <a-box position="0 0.029 0" width="1.02" height="0.010" depth="0.018" color="#f39c12" opacity="0.38" transparent="true"></a-box>
      <a-box position="0 0.030 0" width="0.018" height="0.010" depth="1.02" color="#f39c12" opacity="0.38" transparent="true"></a-box>
    </a-entity>

    <a-entity id="warehouse" position="0 0.042 0" rotation="0 0 0" scale="0.060 0.060 0.060" visible="true"></a-entity>

  </a-marker>

  <a-entity id="cameraRig" camera></a-entity>
</a-scene>

<script>
const SPECIAL_RACKS = ['RC05','RC10','RC14','RC16'];

const RACKS = [
  {id:'RC01', x:-8.6, z:-4.8, levels:4, bays:8, occ:22, cap:32, nps:['98A1850','100506046'], zone:'SURTIDO', dir:'LTR'},
  {id:'RC02', x:-5.2, z:-4.8, levels:4, bays:8, occ:26, cap:32, nps:['99B5492','E7137200'], zone:'SURTIDO', dir:'RTL'},
  {id:'RC03', x:-1.8, z:-4.8, levels:4, bays:8, occ:14, cap:32, nps:['C5520','J4500'], zone:'SURTIDO', dir:'LTR'},
  {id:'RC04', x: 1.6, z:-4.8, levels:4, bays:8, occ:28, cap:32, nps:['100506046','K8810'], zone:'PACKING', dir:'RTL'},
  {id:'RC05', x: 5.0, z:-4.8, levels:4, bays:8, occ:31, cap:32, nps:['98A1850','D3301'], zone:'ESPECIAL', dir:'LTR'},

  {id:'RC06', x:-8.6, z: 0.0, levels:5, bays:8, occ:35, cap:40, nps:['T1010','98A1850'], zone:'AUDITORIA', dir:'LTR'},
  {id:'RC07', x:-5.2, z: 0.0, levels:5, bays:8, occ:37, cap:40, nps:['100506046','98A1850'], zone:'AUDITORIA', dir:'RTL'},
  {id:'RC08', x:-1.8, z: 0.0, levels:5, bays:8, occ:16, cap:40, nps:['Q5510','N9900'], zone:'CENTRAL', dir:'LTR'},
  {id:'RC09', x: 1.6, z: 0.0, levels:5, bays:8, occ:39, cap:40, nps:['E7137200','C5520'], zone:'PACKING', dir:'RTL'},
  {id:'RC10', x: 5.0, z: 0.0, levels:5, bays:8, occ:32, cap:40, nps:['100506046','99B5492'], zone:'ESPECIAL', dir:'LTR'},

  {id:'RC11', x:-8.6, z: 4.8, levels:4, bays:8, occ:12, cap:32, nps:['P1100','U1120'], zone:'RECIBO', dir:'LTR'},
  {id:'RC12', x:-5.2, z: 4.8, levels:4, bays:8, occ:29, cap:32, nps:['98A1850','M3300'], zone:'RECIBO', dir:'RTL'},
  {id:'RC13', x:-1.8, z: 4.8, levels:4, bays:8, occ:18, cap:32, nps:['R4400','S5521'], zone:'RECIBO', dir:'LTR'},
  {id:'RC14', x: 1.6, z: 4.8, levels:4, bays:8, occ:30, cap:32, nps:['100506046','98A1850'], zone:'ESPECIAL', dir:'RTL'},
  {id:'RC16', x: 5.0, z: 4.8, levels:5, bays:8, occ:38, cap:40, nps:['70CR','E7137200'], zone:'ESPECIAL', dir:'LTR'}
];

let rackMap = new Map();
let localMap = new Map();
let pickableEls = [];

let routeVisible = false;
let heatmap = false;
let styleMode = 'realista';
let highDetail = true;
let warehouseVisible = true;
let anchorVisible = true;
let specialVisible = false;

let currentScale = 0.060;
let currentRotation = 0;
let offsetX = 0;
let offsetZ = 0;

let selectedRackId = null;
let selectedLocalCode = null;

let touchState = null;
let suppressNextClick = false;
let raycaster = null;

function E(tag, attrs = {}){
  const el = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}

function updateInfo(html){
  document.getElementById('info').innerHTML = html;
}

function isSpecialRack(id){
  return SPECIAL_RACKS.includes(id);
}

function isHolo(){
  return styleMode === 'holograma';
}

function frameColor(ratio, rackId){
  if(specialVisible && isSpecialRack(rackId)) return '#f1c40f';

  if(heatmap){
    if(ratio >= 0.90) return '#e74c3c';
    if(ratio >= 0.70) return '#f39c12';
    return '#55efc4';
  }

  return isHolo() ? '#4fc3f7' : '#5f7284';
}

function palletColor(ratio, rackId){
  if(specialVisible && isSpecialRack(rackId)) return '#f39c12';

  if(heatmap){
    if(ratio >= 0.90) return '#e74c3c';
    if(ratio >= 0.70) return '#f39c12';
    return '#55efc4';
  }

  return isHolo() ? '#4fc3f7' : '#1e3c6e';
}

function localPanelColor(){
  return isHolo() ? '#4fc3f7' : '#0e1e38';
}

function zoneColor(zone){
  if(zone === 'RECIBO') return '#55efc4';
  if(zone === 'SURTIDO') return '#f39c12';
  if(zone === 'AUDITORIA') return '#9b59b6';
  if(zone === 'PACKING') return '#4fc3f7';
  if(zone === 'EMBARQUE') return '#3498db';
  if(zone === 'ESPECIAL') return '#f1c40f';
  return '#5f7284';
}

function makePickable(el, action, meta){
  el.setAttribute('class', (el.getAttribute('class') || '') + ' pickable');

  el.addEventListener('loaded', function(){
    el.object3D.userData.pickAction = action;
    el.object3D.userData.pickMeta = meta || {};
  });

  el.addEventListener('click', function(e){
    if(suppressNextClick){
      e.stopPropagation();
      e.preventDefault();
      return;
    }
    e.stopPropagation();
    action();
  });

  pickableEls.push(el);
  return el;
}

function buildWarehouse(){
  const w = document.getElementById('warehouse');
  w.innerHTML = '';
  rackMap.clear();
  localMap.clear();
  pickableEls = [];

  buildFloor(w);
  buildGrid(w);
  buildPerimeter(w);
  buildAisles(w);
  buildSafetyLines(w);
  buildZones(w);
  buildDocks(w);
  buildPackingTables(w);
  buildColumns(w);
  buildForkliftPath(w);

  RACKS.forEach(r => buildRack(w, r));

  buildRoute(w);

  w.appendChild(E('a-text', {
    value:'MiniWMS Layout Operativo · CEVA AR',
    position:'-10.2 0.16 -6.75',
    rotation:'-90 0 0',
    color:'#4fc3f7',
    width:'6.2'
  }));

  restoreSelection();
}

function buildFloor(parent){
  parent.appendChild(E('a-box', {
    position:'-1.8 0 0',
    width:'19.2',
    height:'0.08',
    depth:'14.2',
    color:'#050a16',
    opacity:'0.70',
    transparent:'true'
  }));

  parent.appendChild(E('a-box', {
    position:'-1.8 0.045 0',
    width:'19.35',
    height:'0.012',
    depth:'14.35',
    color:'#4fc3f7',
    opacity:'0.10',
    transparent:'true'
  }));
}

function buildGrid(parent){
  const gridGroup = E('a-entity', {id:'gridGroup'});
  parent.appendChild(gridGroup);

  for(let x=-11; x<=8; x+=1){
    gridGroup.appendChild(E('a-box', {
      position:`${x} 0.046 0`,
      width:'0.012',
      height:'0.010',
      depth:'13.5',
      color:'#1b3660',
      opacity:'0.18',
      transparent:'true'
    }));
  }

  for(let z=-7; z<=7; z+=1){
    gridGroup.appendChild(E('a-box', {
      position:`-1.8 0.047 ${z}`,
      width:'18.8',
      height:'0.010',
      depth:'0.012',
      color:'#1b3660',
      opacity:'0.18',
      transparent:'true'
    }));
  }
}

function buildPerimeter(parent){
  [
    {x:-1.8,z:-7.05,w:19.1,d:0.07},
    {x:-1.8,z: 7.05,w:19.1,d:0.07},
    {x:-11.35,z:0,w:0.07,d:14.1},
    {x: 7.75,z:0,w:0.07,d:14.1}
  ].forEach(b => {
    parent.appendChild(E('a-box', {
      position:`${b.x} 0.075 ${b.z}`,
      width:b.w,
      height:'0.055',
      depth:b.d,
      color:'#4fc3f7',
      opacity:'0.18',
      transparent:'true'
    }));
  });
}

function buildAisles(parent){
  [-2.35, 2.35].forEach(z => {
    parent.appendChild(E('a-box', {
      position:`-1.8 0.073 ${z}`,
      width:'18.5',
      height:'0.035',
      depth:'0.44',
      color:'#f39c12',
      opacity:'0.25',
      transparent:'true'
    }));
  });

  [-10.25, 7.05].forEach(x => {
    parent.appendChild(E('a-box', {
      position:`${x} 0.074 0`,
      width:'0.36',
      height:'0.035',
      depth:'13.25',
      color:'#4fc3f7',
      opacity:'0.16',
      transparent:'true'
    }));
  });
}

function buildSafetyLines(parent){
  for(let x=-10.5; x<=7.2; x+=1.2){
    parent.appendChild(E('a-box', {
      position:`${x} 0.095 -6.05`,
      width:'0.55',
      height:'0.022',
      depth:'0.055',
      color:'#f1c40f',
      opacity:'0.55',
      transparent:'true'
    }));
  }

  for(let x=-10.5; x<=7.2; x+=1.2){
    parent.appendChild(E('a-box', {
      position:`${x} 0.095 6.05`,
      width:'0.55',
      height:'0.022',
      depth:'0.055',
      color:'#f1c40f',
      opacity:'0.55',
      transparent:'true'
    }));
  }
}

function buildZones(parent){
  addZone(parent,'RECIBO',-8.8,6.32,3.2,0.9,'#55efc4');
  addZone(parent,'SURTIDO',-8.8,-6.32,3.6,0.9,'#f39c12');
  addZone(parent,'AUDITORIA',-2.8,6.32,3.7,0.9,'#9b59b6');
  addZone(parent,'PACKING',2.6,-6.32,3.6,0.9,'#4fc3f7');
  addZone(parent,'EMBARQUE',5.8,6.32,3.2,0.9,'#3498db');
}

function addZone(parent,label,x,z,w,d,color){
  parent.appendChild(E('a-box', {
    position:`${x} 0.082 ${z}`,
    width:w,
    height:'0.06',
    depth:d,
    color,
    opacity:'0.43',
    transparent:'true'
  }));

  parent.appendChild(E('a-text', {
    value:label,
    position:`${x - w/2 + 0.16} 0.17 ${z}`,
    rotation:'-90 0 0',
    color:'#e0eaff',
    width:'3.6'
  }));
}

function buildDocks(parent){
  for(let i=0;i<5;i++){
    const x = 2.15 + i*1.05;

    parent.appendChild(E('a-box', {
      position:`${x} 0.18 6.88`,
      width:'0.78',
      height:'0.28',
      depth:'0.24',
      color:'#596b80',
      opacity:'0.86',
      transparent:'true'
    }));

    parent.appendChild(E('a-box', {
      position:`${x} 0.42 7.02`,
      width:'0.72',
      height:'0.34',
      depth:'0.12',
      color:'#4fc3f7',
      opacity:'0.36',
      transparent:'true'
    }));

    parent.appendChild(E('a-box', {
      position:`${x} 0.072 6.58`,
      width:'0.82',
      height:'0.05',
      depth:'0.12',
      color:'#f39c12',
      opacity:'0.72',
      transparent:'true'
    }));
  }
}

function buildPackingTables(parent){
  for(let i=0;i<4;i++){
    const x = 1.0 + i*0.95;

    parent.appendChild(E('a-box', {
      position:`${x} 0.16 -5.85`,
      width:'0.70',
      height:'0.10',
      depth:'0.38',
      color:'#4fc3f7',
      opacity:'0.45',
      transparent:'true'
    }));

    parent.appendChild(E('a-box', {
      position:`${x} 0.08 -5.85`,
      width:'0.62',
      height:'0.12',
      depth:'0.30',
      color:'#5f7284',
      opacity:'0.70',
      transparent:'true'
    }));
  }
}

function buildColumns(parent){
  const cols = [
    [-9.4,-5.05],[-5.9,-5.05],[-2.4,-5.05],[1.1,-5.05],[4.6,-5.05],
    [-9.4, 0.00],[-5.9, 0.00],[-2.4, 0.00],[1.1, 0.00],[4.6, 0.00],
    [-9.4, 5.05],[-5.9, 5.05],[-2.4, 5.05],[1.1, 5.05],[4.6, 5.05]
  ];

  cols.forEach(([x,z]) => {
    parent.appendChild(E('a-cylinder', {
      position:`${x} 0.55 ${z}`,
      radius:'0.08',
      height:'1.08',
      color:'#5f7284',
      opacity:'0.72',
      transparent:'true'
    }));
  });
}

function buildForkliftPath(parent){
  const path = E('a-entity', {id:'forkliftPath'});
  parent.appendChild(path);

  [
    {x:-10.25,z:-4.8,d:3.0},
    {x:-10.25,z:0,d:3.0},
    {x:-10.25,z:4.8,d:3.0},
    {x:7.05,z:-4.8,d:3.0},
    {x:7.05,z:0,d:3.0},
    {x:7.05,z:4.8,d:3.0}
  ].forEach(p => {
    path.appendChild(E('a-box', {
      position:`${p.x} 0.105 ${p.z}`,
      width:'0.12',
      height:'0.022',
      depth:String(p.d),
      color:'#55efc4',
      opacity:'0.18',
      transparent:'true'
    }));
  });
}

function buildRack(parent,rack){
  const group = E('a-entity', {
    id:rack.id,
    class:'rack',
    position:`${rack.x} 0 ${rack.z}`
  });

  const ratio = rack.occ / rack.cap;
  const width = rack.bays * 0.265;
  const depth = 0.82;
  const levelGap = 0.285;
  const height = rack.levels * levelGap + 0.08;
  const fColor = frameColor(ratio, rack.id);
  const pColor = palletColor(ratio, rack.id);
  const special = isSpecialRack(rack.id);

  group.appendChild(E('a-box', {
    position:'0 0.03 0',
    width:String(width + 0.16),
    height:'0.02',
    depth:String(depth + 0.12),
    color:'#000000',
    opacity:'0.18',
    transparent:'true'
  }));

  if(specialVisible && special){
    group.appendChild(E('a-ring', {
      position:`0 0.075 0`,
      rotation:'-90 0 0',
      radiusInner:String(Math.max(width, depth) * 0.52),
      radiusOuter:String(Math.max(width, depth) * 0.67),
      color:'#f1c40f',
      opacity:'0.55',
      transparent:'true',
      animation__pulse:'property: opacity; from: 0.25; to: 0.70; dir: alternate; dur: 750; loop: true'
    }));
  }

  for(let i=0;i<=rack.bays;i++){
    const x = -width/2 + i*(width/rack.bays);

    [-depth/2, depth/2].forEach(z => {
      const post = E('a-box', {
        position:`${x} ${height/2} ${z}`,
        width:'0.035',
        height:String(height),
        depth:'0.035',
        color:fColor,
        opacity:specialVisible && special ? '1' : '0.92',
        transparent:'true'
      });

      makePickable(post, function(){
        highlightRack(rack.id);
      }, {type:'rack', rackId:rack.id});

      group.appendChild(post);
    });
  }

  for(let lv=0;lv<=rack.levels;lv++){
    const y = lv*levelGap + 0.04;

    [-depth/2, depth/2].forEach(z => {
      const beam = E('a-box', {
        position:`0 ${y} ${z}`,
        width:String(width + 0.08),
        height:'0.030',
        depth:'0.045',
        color:specialVisible && special ? '#f1c40f' : '#5f7284',
        opacity:specialVisible && special ? '0.95' : '0.88',
        transparent:'true'
      });

      makePickable(beam, function(){
        highlightRack(rack.id);
      }, {type:'rack', rackId:rack.id});

      group.appendChild(beam);
    });
  }

  let occupiedLeft = rack.occ;
  const cells = [];

  for(let lv=1; lv<=rack.levels; lv++){
    for(let bay=1; bay<=rack.bays; bay++){
      const localX = -width/2 + (bay - 0.5)*(width/rack.bays);
      const cellY = (lv - 0.5)*levelGap + 0.06;
      const frontZ = -depth/2 - 0.02;
      const localCode = `${rack.id}-${lv}-${String(bay).padStart(2,'0')}`;

      if(highDetail){
        const localPanel = E('a-box', {
          position:`${localX} ${cellY} ${frontZ}`,
          width:String((width/rack.bays)-0.035),
          height:'0.17',
          depth:'0.035',
          color:localPanelColor(),
          opacity:isHolo() ? '0.30' : '0.62',
          transparent:'true'
        });

        makePickable(localPanel, function(){
          highlightLocal(localCode);
        }, {type:'local', rackId:rack.id, localCode});

        group.appendChild(localPanel);
      }

      const occ = occupiedLeft > 0;
      if(occ) occupiedLeft--;

      if(occ){
        const palletBox = E('a-box', {
          class:'pallet',
          position:`${localX} ${cellY - 0.012} ${-0.20}`,
          width:String((width/rack.bays)-0.06),
          height:'0.11',
          depth:'0.20',
          color:pColor,
          opacity:isHolo() ? '0.48' : '0.82',
          transparent:'true'
        });

        makePickable(palletBox, function(){
          highlightLocal(localCode);
        }, {type:'local', rackId:rack.id, localCode});

        group.appendChild(palletBox);
      }

      cells.push({level:lv,bay:bay,x:localX,y:cellY,z:-0.20,code:localCode});
      localMap.set(localCode, {rackId:rack.id, level:lv, bay:bay, x:localX, y:cellY, z:-0.20});
    }
  }

  group.appendChild(E('a-text', {
    value:special ? `${rack.id} *` : rack.id,
    position:`${-width/2} ${height+0.12} ${-depth/2-0.18}`,
    rotation:'-90 0 0',
    color:special ? '#f1c40f' : '#4fc3f7',
    width:'2.0'
  }));

  parent.appendChild(group);
  rackMap.set(rack.id,{meta:rack,group,cells});
}

function buildRoute(parent){
  const route = E('a-entity', {id:'routeGroup', visible:'false'});
  parent.appendChild(route);

  const points = [
    {x:-8.8,z:6.2},
    {x:-8.8,z:2.35},
    {x:-5.2,z:2.35},
    {x:-5.2,z:0},
    {x:-5.2,z:-2.35},
    {x:1.6,z:-2.35},
    {x:1.6,z:0},
    {x:5.0,z:0},
    {x:5.0,z:6.2}
  ];

  for(let i=0;i<points.length-1;i++){
    const a = points[i];
    const b = points[i+1];
    const midX = (a.x+b.x)/2;
    const midZ = (a.z+b.z)/2;
    const dx = b.x-a.x;
    const dz = b.z-a.z;
    const len = Math.sqrt(dx*dx + dz*dz);
    const rotY = Math.atan2(dx,dz)*180/Math.PI;

    route.appendChild(E('a-box', {
      position:`${midX} 0.13 ${midZ}`,
      width:'0.18',
      height:'0.05',
      depth:String(len),
      rotation:`0 ${rotY} 0`,
      color:'#f39c12',
      opacity:'0.72',
      transparent:'true'
    }));
  }
}

function applyTransforms(){
  const w = document.getElementById('warehouse');
  w.setAttribute('position',`${offsetX} 0.042 ${offsetZ}`);
  w.setAttribute('rotation',`0 ${currentRotation} 0`);
  w.setAttribute('scale',`${currentScale} ${currentScale} ${currentScale}`);
}

function clearHighlight(showMsg=true){
  document.querySelectorAll('.rack a-box').forEach(box => {
    box.removeAttribute('emissive');
    box.removeAttribute('emissiveIntensity');
    box.removeAttribute('animation__pulse');
  });

  const localHighlight = document.getElementById('localHighlight');
  if(localHighlight){
    localHighlight.parentNode.removeChild(localHighlight);
  }

  selectedRackId = null;
  selectedLocalCode = null;

  if(showMsg){
    updateInfo('<b>Resaltado limpio.</b><br>Busca rack, local o NP demo.');
  }
}

function restoreSelection(){
  if(selectedLocalCode && localMap.has(selectedLocalCode)){
    highlightLocal(selectedLocalCode, true);
    return;
  }

  if(selectedRackId && rackMap.has(selectedRackId)){
    highlightRack(selectedRackId, true);
  }
}

function highlightRack(id, silent=false){
  clearHighlight(false);
  selectedRackId = id;
  selectedLocalCode = null;

  const entry = rackMap.get(id);
  if(!entry) return;

  entry.group.querySelectorAll('a-box').forEach(box => {
    box.setAttribute('emissive', isSpecialRack(id) ? '#f1c40f' : '#4fc3f7');
    box.setAttribute('emissiveIntensity','0.50');
  });

  const ring = E('a-ring', {
    id:'localHighlight',
    position:`${entry.meta.x} 0.12 ${entry.meta.z}`,
    rotation:'-90 0 0',
    radiusInner:'0.62',
    radiusOuter:'0.76',
    color:isSpecialRack(id) ? '#f1c40f' : '#4fc3f7',
    opacity:'0.72',
    transparent:'true',
    animation__pulse:'property: opacity; from: 0.28; to: 0.78; dir: alternate; dur: 650; loop: true'
  });

  document.getElementById('warehouse').appendChild(ring);

  const r = entry.meta;
  const pct = Math.round(r.occ/r.cap*100);
  const specialText = isSpecialRack(r.id) ? '<br><b>Tipo:</b> Rack especial / lógica prioritaria' : '';

  if(!silent){
    updateInfo(
      `<b>Rack seleccionado:</b> ${r.id}<br>` +
      `Zona: <b>${r.zone}</b>${specialText}<br>` +
      `Ocupación: <b>${r.occ}/${r.cap}</b> · <b>${pct}%</b><br>` +
      `Niveles: <b>${r.levels}</b> · Locales por nivel: <b>${r.bays}</b><br>` +
      `NP demo: <b>${r.nps.join(', ')}</b>`
    );
  }
}

function highlightLocal(code, silent=false){
  clearHighlight(false);
  selectedLocalCode = code;

  const local = localMap.get(code);
  if(!local){
    updateInfo(`No encontré local: <b>${code}</b>`);
    return;
  }

  selectedRackId = local.rackId;

  const rack = rackMap.get(local.rackId);
  if(!rack) return;

  rack.group.querySelectorAll('a-box').forEach(box => {
    box.setAttribute('emissive','#4fc3f7');
    box.setAttribute('emissiveIntensity','0.18');
  });

  const h = E('a-entity', {id:'localHighlight'});
  document.getElementById('warehouse').appendChild(h);

  const worldX = rack.meta.x + local.x;
  const worldY = local.y;
  const worldZ = rack.meta.z + local.z;

  h.appendChild(E('a-box', {
    position:`${worldX} ${worldY} ${worldZ}`,

    height:'0.24',

    opacity:'0.48',
    transparent:'true',
    animation__pulse:'property: opacity; from: 0.25; to: 0.65; dir: alternate; dur: 650; loop: true'
  }));

  h.appendChild(E('a-sphere', {
    position:`${worldX} ${worldY+0.42} ${worldZ}`,

    color:'#4fc3f7',
    opacity:'0.95'
  }));

  h.appendChild(E('a-cylinder', {
    position:`${worldX} ${worldY+0.20} ${worldZ}`,
    radius:'0.025',
    height:'0.40',
    color:'#f39c12',
    opacity:'0.80',
    transparent:'true'
  }));

  if(!silent){
    updateInfo(
      `<b>Local seleccionado:</b> ${code}<br>` +
      `Rack: <b>${local.rackId}</b> · Zona: <b>${rack.meta.zone}</b><br>` +
      `Nivel: <b>${local.level}</b> · Posición: <b>${String(local.bay).padStart(2,'0')}</b><br>` +
      `Acción sugerida: validar NP/lote en MiniWMS maestro.`
    );
  }
}

function normalizeSearch(text){
  return text
    .trim()
    .toUpperCase()
    .replace(/\s+/g,'')
    .replace(/[–—]/g,'-');
}

function searchTarget(){
  const q = normalizeSearch(document.getElementById('searchInput').value);

  if(!q){
    updateInfo('Escribe un rack, local o NP demo.');
    return;
  }

  if(rackMap.has(q)){
    highlightRack(q);
    return;
  }

  if(localMap.has(q)){
    highlightLocal(q);
    return;
  }

  const inventory = {
    '98A1850':'RC07-3-05',
    '100506046':'RC10-2-04',
    '1110CR':'RC14-4-03',
    '70CR':'RC16-2-06',
    '99B5492':'RC05-1-02',
    'E7137200':'RC08-5-04'
  };

  if(inventory[q]){
    highlightLocal(inventory[q]);
    return;
  }

  const hits = RACKS.filter(r => r.nps.some(np => np.includes(q)));

  if(hits.length){
    clearHighlight(false);

    hits.forEach(r => {
      const entry = rackMap.get(r.id);
      if(entry){
        entry.group.querySelectorAll('a-box').forEach(box => {
          box.setAttribute('emissive','#55efc4');
          box.setAttribute('emissiveIntensity','0.45');
        });
      }
    });

    updateInfo(`<b>NP demo encontrado:</b> ${q}<br>Ubicaciones relacionadas: <b>${hits.map(h=>h.id).join(', ')}</b>`);
    return;
  }

  updateInfo(`No encontré: <b>${q}</b>`);
}

function getTouchDistance(t1,t2){
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function getTouchMidpoint(t1,t2){
  return {
    x:(t1.clientX + t2.clientX)/2,
    y:(t1.clientY + t2.clientY)/2
  };
}

function getCanvasPoint(clientX, clientY){
  const scene = document.getElementById('scene');
  const canvas = scene.canvas;
  const rect = canvas.getBoundingClientRect();

  return {
    x:((clientX - rect.left) / rect.width) * 2 - 1,
    y:-((clientY - rect.top) / rect.height) * 2 + 1
  };
}

function getPickActionFromObject(obj){
  let current = obj;

  while(current){
    if(current.userData && current.userData.pickAction){
      return current.userData.pickAction;
    }
    current = current.parent;
  }

  return null;
}

function pickByRay(clientX, clientY){
  const scene = document.getElementById('scene');

  if(!scene || !scene.camera || !scene.canvas){
    return false;
  }

  if(!raycaster){
    raycaster = new THREE.Raycaster();
  }

  const ndc = getCanvasPoint(clientX, clientY);
  raycaster.setFromCamera(ndc, scene.camera);

  const objects = pickableEls
    .filter(el => el && el.object3D)
    .map(el => el.object3D);

  const hits = raycaster.intersectObjects(objects, true);

  for(let i=0; i<hits.length; i++){
    const action = getPickActionFromObject(hits[i].object);
    if(action){
      action();
      return true;
    }
  }

  return false;
}

function pickNearestRack(clientX, clientY){
  const scene = document.getElementById('scene');

  if(!scene || !scene.camera || !scene.canvas){
    return false;
  }

  const canvas = scene.canvas;
  const rect = canvas.getBoundingClientRect();
  let bestRack = null;
  let bestDist = Infinity;

  rackMap.forEach((entry, id) => {
    if(!entry.group || !entry.group.object3D) return;

    const pos = new THREE.Vector3();
    entry.group.object3D.getWorldPosition(pos);
    pos.project(scene.camera);

    const sx = rect.left + (pos.x + 1) * rect.width / 2;
    const sy = rect.top + (-pos.y + 1) * rect.height / 2;

    const dx = sx - clientX;
    const dy = sy - clientY;
    const d = Math.sqrt(dx*dx + dy*dy);

    if(d < bestDist){
      bestDist = d;
      bestRack = id;
    }
  });

  if(bestRack && bestDist < 135){
    highlightRack(bestRack);
    return true;
  }

  return false;
}

function selectFromTap(clientX, clientY){
  const byRay = pickByRay(clientX, clientY);

  if(byRay){
    return;
  }

  const byNearest = pickNearestRack(clientX, clientY);

  if(!byNearest){
    updateInfo('<b>Selección:</b> no detecté rack en ese toque.<br>Acércate un poco más o usa búsqueda por RC/NP.');
  }
}

function bindSafeTouchControls(){
  const scene = document.getElementById('scene');

  function attach(){
    const canvas = scene.canvas;

    if(!canvas){
      setTimeout(attach,300);
      return;
    }

    canvas.style.touchAction = 'none';

    canvas.addEventListener('touchstart', function(e){
      if(e.touches.length === 1){
        const t = e.touches[0];

        touchState = {
          mode:'rotate',
          startX:t.clientX,
          startY:t.clientY,
          startRotation:currentRotation,
          moved:false
        };
      }

      if(e.touches.length === 2){
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const mid = getTouchMidpoint(t1,t2);

        touchState = {
          mode:'pinch',
          startDistance:getTouchDistance(t1,t2),
          startScale:currentScale,
          startMidX:mid.x,
          startMidY:mid.y,
          startOffsetX:offsetX,
          startOffsetZ:offsetZ,
          moved:true
        };
      }
    }, {passive:false});

    canvas.addEventListener('touchmove', function(e){
      if(!touchState) return;

      e.preventDefault();

      if(touchState.mode === 'rotate' && e.touches.length === 1){
        const t = e.touches[0];
        const dx = t.clientX - touchState.startX;
        const dy = t.clientY - touchState.startY;

        if(Math.abs(dx) > 4 || Math.abs(dy) > 4){
          touchState.moved = true;
          suppressNextClick = true;
        }

        currentRotation = touchState.startRotation + dx * 0.22;
        applyTransforms();
      }

      if(touchState.mode === 'pinch' && e.touches.length === 2){
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const dist = getTouchDistance(t1,t2);
        const mid = getTouchMidpoint(t1,t2);
        const ratio = dist / Math.max(1,touchState.startDistance);

        currentScale = Math.max(0.024,Math.min(0.16,touchState.startScale * ratio));

        offsetX = touchState.startOffsetX + (mid.x - touchState.startMidX) * 0.004;
        offsetZ = touchState.startOffsetZ + (mid.y - touchState.startMidY) * 0.004;

        suppressNextClick = true;
        applyTransforms();
      }
    }, {passive:false});

    canvas.addEventListener('touchend', function(e){
      if(touchState && touchState.mode === 'rotate' && !touchState.moved){
        const t = e.changedTouches && e.changedTouches[0];

        if(t){
          selectFromTap(t.clientX, t.clientY);
        }
      }

      if(touchState && touchState.moved){
        suppressNextClick = true;
        setTimeout(function(){
          suppressNextClick = false;
        },250);
      }

      touchState = null;
    }, {passive:true});
  }

  if(scene.hasLoaded){
    attach();
  }else{
    scene.addEventListener('loaded', attach);
  }
}

window.addEventListener('load', () => {
  buildWarehouse();
  applyTransforms();
  bindSafeTouchControls();

  const marker = document.getElementById('hiroMarker');
  const status = document.getElementById('status');

  marker.addEventListener('markerFound', () => {
    status.textContent = 'Marcador detectado';
    status.classList.add('ok');
    updateInfo('<b>Marcador detectado.</b><br>V8.7 Realismo operativo activo. Prueba “Vista operativa” y “Racks especiales”.');
  });

  marker.addEventListener('markerLost', () => {
    status.textContent = 'Buscando HIRO...';
    status.classList.remove('ok');
  });
});

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MiniWMS AR Test · Cubo HIRO</title>

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  background:#000;
  font-family:Segoe UI,Arial,sans-serif;
}

#top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  padding:12px;
  background:rgba(5,10,22,.88);
  color:#4fc3f7;
  font-weight:700;
  font-size:15px;
  border-bottom:1px solid #1b3660;
}

#status{
  position:fixed;
  top:55px;
  left:50%;
  transform:translateX(-50%);
  z-index:60;
  padding:8px 14px;
  border-radius:20px;
  background:rgba(90,0,0,.88);
  color:#ffb3b3;
  border:1px solid #e74c3c;
  font-size:13px;
  text-align:center;
  min-width:220px;
}

#status.ok{
  background:rgba(0,70,35,.88);
  color:#55efc4;
  border-color:#2ecc71;
}

#controls{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:70;
  background:rgba(5,10,22,.88);
  border:1px solid #1b3660;
  border-radius:16px;
  padding:12px;
  color:white;
}

button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #4fc3f7;
  background:rgba(18,38,75,.9);
  color:#4fc3f7;
  font-size:15px;
  font-weight:700;
}

#info{
  margin-top:8px;
  font-size:12px;
  color:#a8d4ff;
  line-height:1.5;
}
</style>
</head>

<body>

<div id="top">🏭 MiniWMS AR · Prueba de Render 3D</div>
<div id="status">Buscando marcador HIRO...</div>

<div id="controls">
  <button onclick="toggleObjects()">Mostrar / Ocultar objetos 3D</button>
  <div id="info">
    Debes ver un cubo rojo, una esfera amarilla y una placa azul exactamente encima del marcador HIRO.
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; antialias:true; alpha:true;"
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; trackingMethod:best;">

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">

    <!-- PLACA AZUL GIGANTE SOBRE EL MARCADOR -->
    <a-box
      id="basePlate"
      position="0 0.02 0"
      width="1.4"
      height="0.03"
      depth="1.4"
      color="#00d9ff"
      opacity="0.75"
      transparent="true">
    </a-box>

    <!-- CUBO ROJO GRANDE -->
    <a-box
      id="testCube"
      position="0 0.45 0"
      width="0.55"
      height="0.55"
      depth="0.55"
      color="#ff0033">
    </a-box>

    <!-- ESFERA AMARILLA ARRIBA -->
    <a-sphere
      id="testSphere"
      position="0 0.95 0"
      radius="0.18"
      color="#ffe000">
    </a-sphere>

    <!-- CRUZ VERDE PARA VER EL CENTRO -->
    <a-box
      id="centerLineX"
      position="0 0.08 0"
      width="1.8"
      height="0.035"
      depth="0.035"
      color="#00ff66">
    </a-box>

    <a-box
      id="centerLineZ"
      position="0 0.09 0"
      width="0.035"
      height="0.035"
      depth="1.8"
      color="#00ff66">
    </a-box>

    <!-- TEXTO FLOTANTE -->
    <a-text
      value="HIRO OK"
      position="-0.45 1.25 0"
      rotation="-90 0 0"
      color="#ffffff"
      width="3">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
let objectsVisible = true;

function toggleObjects(){
  objectsVisible = !objectsVisible;

  const ids = [
    "basePlate",
    "testCube",
    "testSphere",
    "centerLineX",
    "centerLineZ"
  ];

  ids.forEach(id => {
    const el = document.getElementById(id);
    if(el){
      el.setAttribute("visible", objectsVisible ? "true" : "false");
    }
  });
}

window.addEventListener("load", () => {
  const marker = document.getElementById("hiroMarker");
  const status = document.getElementById("status");

  marker.addEventListener("markerFound", () => {
    status.textContent = "Marcador detectado · Debe verse el cubo 3D";
    status.classList.add("ok");
  });

  marker.addEventListener("markerLost", () => {
    status.textContent = "Buscando marcador HIRO...";
    status.classList.remove("ok");
  });
});
</script>

</body>
</html>
